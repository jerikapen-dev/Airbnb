<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Portfolio dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
:root{
  --paper:#F4F5F1; --paper-raised:#FFFFFF;
  --ink:#141F1B; --ink-soft:#5C6B64;
  --line:#DDE1DA; --line-soft:#E9EBE5;
  --teal:#12564E; --teal-l:#E2EFEC; --teal-dark:#0C3E38;
  --amber:#A6641F; --amber-l:#FAEBD8;
  --green:#2F6B45; --green-l:#E4F0E6;
  --rust:#9C3E2E; --rust-l:#F8E7E3;
  --shadow-sm:0 1px 2px rgba(20,31,27,.05);
  --shadow-md:0 2px 6px rgba(20,31,27,.06), 0 10px 24px -12px rgba(20,31,27,.12);
  --muted:var(--ink-soft);
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper)}
#app{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;border:1px solid var(--line);max-width:1100px;margin:0 auto;box-shadow:var(--shadow-md)}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Fraunces',serif}

.topbar{position:relative;padding:22px 26px 18px;background:var(--paper-raised);display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:
  repeating-linear-gradient(90deg,var(--teal) 0 24px, transparent 24px 26px);
  opacity:.5}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm)}
.brand-mark svg{width:18px;height:18px}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:0 0 2px}
.topbar h1{font-family:'Fraunces',serif;font-weight:600;font-size:23px;margin:0;letter-spacing:-.01em}
.topbar p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 26px;background:var(--paper)}
.metric{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease}
.metric .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.metric .val{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;margin-top:5px;letter-spacing:-.01em}

.tabs{display:flex;gap:2px;padding:6px 22px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line);background:var(--paper-raised);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink-soft);border-radius:8px;white-space:nowrap;-webkit-user-select:none;user-select:none;transition:background .12s ease,color .12s ease}
.tab:hover{background:var(--line-soft);color:var(--ink)}
.tab.active{color:var(--paper-raised);background:var(--teal);font-weight:600}
.tab.active:hover{background:var(--teal-dark)}

.panel{padding:22px 26px 90vh}
.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-raised);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--line-soft)}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{transition:background .1s ease}
tbody tr:hover{background:var(--teal-l)}
tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}

.section-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}

form.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
form.row .field{display:flex;flex-direction:column;gap:5px;flex:1 1 140px;min-width:120px}
form.row label{font-size:11px;color:var(--ink-soft);font-weight:500}

input,select{font-family:'Inter',sans-serif;font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-raised);color:var(--ink);min-height:44px;width:100%;transition:border-color .12s ease,box-shadow .12s ease}
input:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-l)}
input[type=checkbox]{min-height:auto}

button{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;padding:11px 18px;border-radius:var(--radius-sm);border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;min-height:44px;-webkit-user-select:none;user-select:none;transition:background .12s ease,border-color .12s ease,transform .06s ease}
button:hover{background:var(--teal-dark);border-color:var(--teal-dark)}
button:active{transform:translateY(1px)}
button.ghost{background:var(--paper-raised);color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{background:var(--line-soft);border-color:var(--line)}
button.small{padding:8px 13px;font-size:12px;min-height:36px}

.empty{color:var(--ink-soft);font-size:13px;padding:28px 20px;text-align:center;background:var(--paper-raised);border:1px dashed var(--line);border-radius:var(--radius)}

@media (max-width:820px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .topbar{padding:18px 16px 14px}
  .tabs{padding:6px 12px}
  .panel{padding:16px 16px 90vh}
  .metric .val{font-size:17px}
  form.row .field{flex:1 1 100%}
}
@media (max-width:520px){
  .metrics{grid-template-columns:1fr 1fr;gap:8px}
  .topbar{flex-direction:column;align-items:flex-start}
  .topbar button{width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var LS_PREFIX='pmDashboard:';
  var storage={
    get:function(key){
      try{
        var v=localStorage.getItem(LS_PREFIX+key);
        return Promise.resolve(v===null?null:{key:key,value:v});
      }catch(e){ return Promise.reject(e); }
    },
    set:function(key,value){
      try{
        localStorage.setItem(LS_PREFIX+key,value);
        return Promise.resolve({key:key,value:value});
      }catch(e){ return Promise.reject(e); }
    }
  };
  var props=[], bookings=[], expenses=[], activeTab='overview', loaded=false;
  var MGMT_FEE_RATE=0.12;
  var CLEANING_CATEGORIES={'Cleaning':1,'Deep cleaning':1,'Grease trap':1,'Aircon cleaning':1};
  var cleaners=['Cleaner A','Cleaner B','Cleaner C','Cleaner D'];
  var cleaningOverrides={};
  var cleaningPayOverrides={};
  var cleaningFeeOverrides={};
  var cleaningDone={};
  var TURNOVER_DEFAULTS={'Studio':400,'1BR':500,'2BR':700,'3BR':800};
  var TURNOVER_PRESETS=[400,500,700,750];
  var CLEANING_FEE_PRESETS=[0,600,800,1550];
  var CLEANING_FEE_DEFAULT=600;
  var maintenanceIntervals={aircon:4, grease:1};

  function uid(){return Math.random().toString(36).slice(2,9);}
  function fmt(n){return (n<0?'-':'')+'\u20B1'+Math.abs(Math.round(n)).toLocaleString();}
  function isoLocal(d){var y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();return y+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;}
  function today(){return isoLocal(new Date());}
  function monthKey(d){return d.slice(0,7);}
  function thisMonth(){return monthKey(today());}
  function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoLocal(d);}
  function addMonths(iso,n){var d=new Date(iso+'T00:00:00');d.setMonth(d.getMonth()+n);return isoLocal(d);}
  function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
  function weekdayShort(iso){return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'});}
  function triggerDownload(blob,filename){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.rel='noopener';
    a.style.position='fixed';
    a.style.top='-1000px';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },2000);
  }

  async function load(){
    try{var r=await storage.get('properties');props=r?JSON.parse(r.value):[];}catch(e){props=[];}
    try{var r2=await storage.get('bookings');bookings=r2?JSON.parse(r2.value):[];}catch(e){bookings=[];}
    try{var r3=await storage.get('expenses');expenses=r3?JSON.parse(r3.value):[];}catch(e){expenses=[];}
    try{var r4=await storage.get('cleaners');cleaners=r4?JSON.parse(r4.value):['Cleaner A','Cleaner B','Cleaner C','Cleaner D'];}catch(e){cleaners=['Cleaner A','Cleaner B','Cleaner C','Cleaner D'];}
    try{var r5=await storage.get('cleaningOverrides');cleaningOverrides=r5?JSON.parse(r5.value):{};}catch(e){cleaningOverrides={};}
    try{var r6=await storage.get('cleaningPayOverrides');cleaningPayOverrides=r6?JSON.parse(r6.value):{};}catch(e){cleaningPayOverrides={};}
    try{var r10=await storage.get('dismissedConflicts');dismissedConflicts=r10?JSON.parse(r10.value):{};}catch(e){dismissedConflicts={};}
    try{var r9=await storage.get('cleaningFeeOverrides');cleaningFeeOverrides=r9?JSON.parse(r9.value):{};}catch(e){cleaningFeeOverrides={};}
    try{var r8=await storage.get('cleaningDone');cleaningDone=r8?JSON.parse(r8.value):{};}catch(e){cleaningDone={};}
    try{var r7=await storage.get('maintenanceIntervals');maintenanceIntervals=r7?JSON.parse(r7.value):{aircon:4,grease:1};}catch(e){maintenanceIntervals={aircon:4,grease:1};}
    loaded=true; render();
  }
  async function save(key,val){
    try{await storage.set(key,JSON.stringify(val));}catch(e){console.error('save failed',key,e);}
  }

  function propName(id){var p=props.find(function(x){return x.id===id});return p?p.name:'\u2014';}
  function propShort(id){var p=props.find(function(x){return x.id===id});if(!p)return'\u2014';return (p.shortcut&&p.shortcut.trim())?p.shortcut.trim():p.name;}
  function suggestShortcut(name){
    var words=name.replace(/[|·]/g,' ').split(/\s+/).filter(Boolean);
    if(words.length===0)return '';
    if(words.length===1)return words[0].slice(0,10);
    return words.slice(0,2).join(' ').slice(0,16);
  }

  function propAllNames(p){
    var names=[p.name];
    if(p.shortcut) names.push(p.shortcut);
    if(p.aliases && p.aliases.length) names=names.concat(p.aliases);
    return names.filter(Boolean).map(function(n){return n.toLowerCase();});
  }

  function findPropertyId(name){
    if(!name)return null;
    var n=String(name).trim().toLowerCase();
    var exact=props.find(function(p){return propAllNames(p).indexOf(n)>-1;});
    if(exact)return exact.id;
    var partial=props.find(function(p){
      return propAllNames(p).some(function(nm){return n.indexOf(nm)>-1||nm.indexOf(n)>-1;});
    });
    return partial?partial.id:null;
  }

  function findPropertyIdByNameOrShortcut(input){
    return findPropertyId(input);
  }

  function toISODate(v){
    if(!v)return '';
    v=String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
    var d=new Date(v);
    if(isNaN(d.getTime()))return '';
    var y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
    return y+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
  }

  function parseCSV(text){
    var rows=[]; var cur=['']; var row=[]; var inQuotes=false;
    var i=0,c;
    function pushField(){row.push(cur.join(''));cur=[];}
    function pushRow(){pushField();rows.push(row);row=[];}
    while(i<text.length){
      c=text[i];
      if(inQuotes){
        if(c==='"'){ if(text[i+1]==='"'){cur.push('"');i+=2;continue;} inQuotes=false;i++;continue;}
        cur.push(c);i++;continue;
      }else{
        if(c==='"'){inQuotes=true;i++;continue;}
        if(c===','){pushField();i++;continue;}
        if(c==='\r'){i++;continue;}
        if(c==='\n'){pushRow();i++;continue;}
        cur.push(c);i++;continue;
      }
    }
    if(cur.length||row.length){pushRow();}
    rows=rows.filter(function(r){return r.length>1||r[0]!=='';});
    if(rows.length===0)return [];
    var headers=rows[0].map(function(h){return h.trim().toLowerCase();});
    return rows.slice(1).map(function(r){
      var obj={};
      headers.forEach(function(h,idx){obj[h]=r[idx]!==undefined?r[idx].trim():'';});
      return obj;
    });
  }

  function pick(obj,keys){
    for(var i=0;i<keys.length;i++){ if(obj[keys[i]]!==undefined && obj[keys[i]]!=='') return obj[keys[i]]; }
    return '';
  }

  function importBookingsCSV(text){
    var rows=parseCSV(text);
    var added=0, skipped=0;
    rows.forEach(function(r){
      var propRaw=pick(r,['property','listing','property name','unit']);
      var propertyId=findPropertyIdByNameOrShortcut(propRaw) || (props.length===1?props[0].id:null);
      var checkIn=toISODate(pick(r,['check-in','checkin','start date','arrival']));
      var checkOut=toISODate(pick(r,['check-out','checkout','end date','departure']));
      // 'amount' = Airbnb's net payout after their service fee, and per your commission structure,
      // the 10/12/20% management fee is calculated on that net payout, so it takes priority.
      var amount=Number(pick(r,['amount','payout','gross earnings','earnings','total payout','price']).toString().replace(/[^0-9.\-]/g,''))||0;
      var guest=pick(r,['guest','guest name']);
      var channel=pick(r,['channel','platform','source']);
      if(!channel){ channel = (r['service fee']!==undefined || r['gross earnings']!==undefined) ? 'Airbnb' : 'Other'; }
      if(!propertyId||!checkIn||!checkOut){skipped++;return;}
      bookings.push({id:uid(),propertyId:propertyId,guest:guest||'Guest',channel:channel,checkIn:checkIn,checkOut:checkOut,amount:amount,checkedIn:false,checkedOut:false});
      added++;
    });
    if(added>0)save('bookings',bookings);
    return {added:added,skipped:skipped};
  }

  function importExpensesCSV(text){
    var rows=parseCSV(text);
    var added=0, skipped=0;
    rows.forEach(function(r){
      var propRaw=pick(r,['property','listing','property name','unit']);
      var propertyId=findPropertyIdByNameOrShortcut(propRaw) || (props.length===1?props[0].id:null);
      var date=toISODate(pick(r,['date']));
      var amount=Number(pick(r,['amount','cost','total']).toString().replace(/[^0-9.\-]/g,''))||0;
      var actualCostRaw=pick(r,['actual cost','contractor cost','cost paid','actual']);
      var actualCost=actualCostRaw ? Number(actualCostRaw.toString().replace(/[^0-9.\-]/g,'')) : null;
      var category=pick(r,['category','type'])||'Other';
      var note=pick(r,['note','notes','description']);
      if(!propertyId||!date){skipped++;return;}
      expenses.push({id:uid(),propertyId:propertyId,category:category,amount:amount,actualCost:actualCost,date:date,note:note});
      added++;
    });
    if(added>0)save('expenses',expenses);
    return {added:added,skipped:skipped};
  }

  function importPropertiesCSV(text){
    var rows=parseCSV(text);
    var names=[];
    var seen={};
    rows.forEach(function(r){
      var name=pick(r,['property','listing','property name','unit','name']).trim();
      if(!name || seen[name.toLowerCase()]) return;
      seen[name.toLowerCase()]=1;
      names.push(name);
    });
    var added=0, skipped=0;
    names.forEach(function(name){
      if(findPropertyId(name)){ skipped++; return; }
      props.push({id:uid(),name:name,type:'Studio',cleanerIndex:0,mgmtFeeRate:0.12,turnoverRate:TURNOVER_DEFAULTS['Studio'],cleaningFeeRate:CLEANING_FEE_DEFAULT});
      added++;
    });
    if(added>0)save('properties',props);
    return {added:added,skipped:skipped};
  }

  function importTurnoverRatesCSV(text){
    var rows=parseCSV(text);
    var updated=0, skipped=0;
    rows.forEach(function(r){
      var nameRaw=pick(r,['property','listing','shortcut','name','property name']);
      var rateRaw=pick(r,['turnover rate','turnover pay','rate','turnover','pay','amount']);
      var propertyId=findPropertyIdByNameOrShortcut(nameRaw);
      var rate=Number(String(rateRaw).replace(/[^0-9.\-]/g,''));
      if(!propertyId || !rateRaw || isNaN(rate)){ skipped++; return; }
      var p=props.find(function(x){return x.id===propertyId;});
      p.turnoverRate=rate;
      updated++;
    });
    if(updated>0)save('properties',props);
    return {updated:updated,skipped:skipped};
  }

  function importCleaningFeeRatesCSV(text){
    var rows=parseCSV(text);
    var updated=0, skipped=0;
    rows.forEach(function(r){
      var nameRaw=pick(r,['property','listing','shortcut','name','property name']);
      var rateRaw=pick(r,['cleaning fee','cleaning & laundry fee','cleaning rate','rate','fee','amount']);
      var propertyId=findPropertyIdByNameOrShortcut(nameRaw);
      var rate=Number(String(rateRaw).replace(/[^0-9.\-]/g,''));
      if(!propertyId || !rateRaw || isNaN(rate)){ skipped++; return; }
      var p=props.find(function(x){return x.id===propertyId;});
      p.cleaningFeeRate=rate;
      updated++;
    });
    if(updated>0)save('properties',props);
    return {updated:updated,skipped:skipped};
  }

  function occupancyStatus(propId){
    var t=today();
    var b=bookings.find(function(x){return x.propertyId===propId && x.checkIn<=t && x.checkOut>t;});
    return b?{state:'occupied',guest:b.guest}:{state:'vacant'};
  }

  function detectDoubleBookings(){
    var conflicts=[];
    var byProp={};
    bookings.forEach(function(b){ (byProp[b.propertyId]=byProp[b.propertyId]||[]).push(b); });
    Object.keys(byProp).forEach(function(pid){
      var list=byProp[pid].slice().sort(function(a,b){return a.checkIn.localeCompare(b.checkIn);});
      for(var i=0;i<list.length;i++){
        for(var j=i+1;j<list.length;j++){
          var a=list[i], b=list[j];
          if(a.checkIn<b.checkOut && b.checkIn<a.checkOut){
            conflicts.push({propertyId:pid, a:a, b:b});
          }
        }
      }
    });
    return conflicts;
  }

  function duplicateBookingIds(){
    var groups={};
    bookings.forEach(function(b){
      var key=(b.guest||'').trim().toLowerCase()+'|'+b.checkIn+'|'+b.checkOut+'|'+Number(b.amount||0).toFixed(2);
      (groups[key]=groups[key]||[]).push(b);
    });
    var flagged={};
    Object.keys(groups).forEach(function(key){
      if(groups[key].length>1){
        groups[key].forEach(function(b){ flagged[b.id]=groups[key].length; });
      }
    });
    return flagged;
  }

  function todaysCheckouts(){
    var t=today();
    return bookings.filter(function(b){return b.checkOut===t;});
  }

  function upcomingVacancies(days){
    var t=today();
    var horizon=addDays(t,days);
    return props.filter(function(p){
      var hasUpcoming=bookings.some(function(b){return b.propertyId===p.id && b.checkOut>t && b.checkIn<horizon;});
      return !hasUpcoming;
    });
  }

  function monthTotals(propId,mk){
    var rev=bookings.filter(function(b){return b.propertyId===propId && monthKey(b.checkIn)===mk;})
      .reduce(function(s,b){return s+Number(b.amount||0);},0);
    var exp=expenses.filter(function(e){return e.propertyId===propId && monthKey(e.date)===mk;})
      .reduce(function(s,e){return s+Number(e.amount||0);},0);
    var nights=bookings.filter(function(b){return b.propertyId===propId && monthKey(b.checkIn)===mk;})
      .reduce(function(s,b){return s+Math.round((new Date(b.checkOut)-new Date(b.checkIn))/86400000);},0);
    var daysInMonth=new Date(Number(mk.slice(0,4)), Number(mk.slice(5,7)), 0).getDate();
    var occRate=daysInMonth>0 ? (nights/daysInMonth*100) : 0;
    var avgRate=nights>0 ? (rev/nights) : 0;
    return {rev:rev,exp:exp,net:rev-exp,nights:nights,occRate:occRate,avgRate:avgRate};
  }

  function overallTotals(){
    var mk=thisMonth();
    var rev=bookings.filter(function(b){return monthKey(b.checkIn)===mk;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
    var exp=expenses.filter(function(e){return monthKey(e.date)===mk;}).reduce(function(s,e){return s+Number(e.amount||0);},0);
    var occ=props.filter(function(p){return occupancyStatus(p.id).state==='occupied';}).length;
    return {rev:rev,exp:exp,net:rev-exp,occ:occ,total:props.length};
  }

  function lastFullMonthKey(){
    var t=new Date();
    var firstOfThisMonth=new Date(t.getFullYear(),t.getMonth(),1);
    var lastDayPrevMonth=new Date(firstOfThisMonth.getTime()-86400000);
    return isoLocal(lastDayPrevMonth).slice(0,7);
  }

  function monthsFromTo(startKey,endKey){
    var months=[];
    var y=Number(startKey.slice(0,4)), m=Number(startKey.slice(5,7));
    var endY=Number(endKey.slice(0,4)), endM=Number(endKey.slice(5,7));
    while(y<endY || (y===endY && m<=endM)){
      months.push(y+'-'+(m<10?'0':'')+m);
      m++; if(m>12){m=1;y++;}
    }
    return months;
  }

  function monthAllPropsTotals(mk){
    var rev=bookings.filter(function(b){return monthKey(b.checkIn)===mk;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
    var exp=expenses.filter(function(e){return monthKey(e.date)===mk;}).reduce(function(s,e){return s+Number(e.amount||0);},0);
    return {rev:rev,exp:exp,net:rev-exp};
  }

  function computeRevenueSummary(){
    var start='2026-01';
    var end=lastFullMonthKey();
    if(end<start) return [];
    var months=monthsFromTo(start,end);
    var rows=months.map(function(mk){
      var t=monthAllPropsTotals(mk);
      return {month:mk,year:mk.slice(0,4),rev:t.rev,exp:t.exp,net:t.net};
    });
    return rows;
  }

  function mergeProperties(fromId,intoId){
    if(!fromId||!intoId||fromId===intoId) return {merged:0};
    var fromProp=props.find(function(p){return p.id===fromId;});
    var intoProp=props.find(function(p){return p.id===intoId;});
    if(!fromProp||!intoProp) return {merged:0};

    var movedBookings=0, movedExpenses=0;
    bookings.forEach(function(b){ if(b.propertyId===fromId){ b.propertyId=intoId; movedBookings++; } });
    expenses.forEach(function(e){ if(e.propertyId===fromId){ e.propertyId=intoId; movedExpenses++; } });

    intoProp.aliases = intoProp.aliases || [];
    [fromProp.name, fromProp.shortcut].concat(fromProp.aliases||[]).forEach(function(n){
      if(n && intoProp.aliases.indexOf(n)===-1 && n.toLowerCase()!==intoProp.name.toLowerCase()) intoProp.aliases.push(n);
    });

    props=props.filter(function(p){return p.id!==fromId;});

    save('properties',props); save('bookings',bookings); save('expenses',expenses);
    return {merged:1, movedBookings:movedBookings, movedExpenses:movedExpenses, fromName:fromProp.name, intoName:intoProp.name};
  }

  function mgmtRateFor(propertyId){
    var p=props.find(function(x){return x.id===propertyId;});
    return (p&&p.mgmtFeeRate!==undefined&&p.mgmtFeeRate!==null) ? p.mgmtFeeRate : 0.12;
  }

  var EXPENSE_BUCKET={
    'Repairs':'maintenance', 'Grease trap':'maintenance', 'Aircon cleaning':'maintenance',
    'Replacement item':'replacement'
  };
  function bucketFor(category){ return EXPENSE_BUCKET[category] || 'other'; }

  function computeCleaningFeeForMonth(propertyId,mk){
    var checkoutsInMonth = bookings.filter(function(b){return monthKey(b.checkOut)===mk && (propertyId==='ALL'||b.propertyId===propertyId);});
    return checkoutsInMonth.reduce(function(sum,b,i){ return sum + buildCleaningTask(b,i).ownerFee; },0);
  }

  function computeOwnerReport(propertyId,mk){
    var relevantProps = propertyId==='ALL' ? props : props.filter(function(p){return p.id===propertyId;});
    var bks = bookings.filter(function(b){return monthKey(b.checkIn)===mk && (propertyId==='ALL'||b.propertyId===propertyId);});
    var exs = expenses.filter(function(e){return monthKey(e.date)===mk && (propertyId==='ALL'||e.propertyId===propertyId);});
    var gross = bks.reduce(function(s,b){return s+Number(b.amount||0);},0);

    var mgmtFee = relevantProps.reduce(function(sum,p){
      var grossP = bks.filter(function(b){return b.propertyId===p.id;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
      return sum + grossP*mgmtRateFor(p.id);
    },0);

    var cleaningLaundry = computeCleaningFeeForMonth(propertyId,mk);

    var buckets={maintenance:0, replacement:0, other:0};
    exs.forEach(function(e){
      buckets[bucketFor(e.category)] += Number(e.amount||0);
    });

    var totalExp = cleaningLaundry + buckets.maintenance + buckets.replacement + buckets.other;
    var netOwner = gross - mgmtFee - totalExp;
    function pct(v){ return gross>0 ? (v/gross*100) : 0; }
    return {gross:gross, mgmtFee:mgmtFee, maintenance:buckets.maintenance, replacement:buckets.replacement,
      other:buckets.other, cleaningLaundry:cleaningLaundry, totalExp:totalExp, netOwner:netOwner,
      mgmtPct:pct(mgmtFee), maintenancePct:pct(buckets.maintenance), replacementPct:pct(buckets.replacement),
      otherPct:pct(buckets.other), cleaningLaundryPct:pct(cleaningLaundry), totalExpPct:pct(totalExp)};
  }

  function computeMyEarnings(propertyId,mk){
    var relevantProps = propertyId==='ALL' ? props : props.filter(function(p){return p.id===propertyId;});
    var bks = bookings.filter(function(b){return monthKey(b.checkIn)===mk && (propertyId==='ALL'||b.propertyId===propertyId);});
    var exs = expenses.filter(function(e){return monthKey(e.date)===mk && (propertyId==='ALL'||e.propertyId===propertyId);});
    var gross = bks.reduce(function(s,b){return s+Number(b.amount||0);},0);

    var mgmtFee = relevantProps.reduce(function(sum,p){
      var grossP = bks.filter(function(b){return b.propertyId===p.id;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
      return sum + grossP*mgmtRateFor(p.id);
    },0);

    var replacementBilled=0, replacementActual=0, maintenanceBilled=0, maintenanceActual=0;
    exs.forEach(function(e){
      var bucket=bucketFor(e.category);
      var amt=Number(e.amount||0);
      var actual=(e.actualCost!==undefined && e.actualCost!==null) ? Number(e.actualCost) : amt;
      if(bucket==='replacement'){ replacementBilled+=amt; replacementActual+=actual; }
      else if(bucket==='maintenance'){ maintenanceBilled+=amt; maintenanceActual+=actual; }
    });
    var replacementMargin=replacementBilled-replacementActual;
    var maintenanceMargin=maintenanceBilled-maintenanceActual;

    // Cleaning fee (billed to owner) and turnover pay (owed to cleaner) both run off checkout date, same as the Cleaning Schedule
    var checkoutsInMonth = bookings.filter(function(b){return monthKey(b.checkOut)===mk && (propertyId==='ALL'||b.propertyId===propertyId);});
    var cleaningLaundry=0, turnoverPaid=0;
    checkoutsInMonth.forEach(function(b,i){
      var task=buildCleaningTask(b,i);
      cleaningLaundry+=task.ownerFee;
      turnoverPaid+=task.pay;
    });

    var myEarnings = mgmtFee + cleaningLaundry + replacementMargin + maintenanceMargin - turnoverPaid;
    return {gross:gross, mgmtFee:mgmtFee, cleaningLaundry:cleaningLaundry,
      replacementBilled:replacementBilled, replacementActual:replacementActual, replacementMargin:replacementMargin,
      maintenanceBilled:maintenanceBilled, maintenanceActual:maintenanceActual, maintenanceMargin:maintenanceMargin,
      turnoverPaid:turnoverPaid, myEarnings:myEarnings};
  }

  function turnoverRateFor(propertyId){
    var p=props.find(function(x){return x.id===propertyId;});
    if(p && p.turnoverRate!==undefined && p.turnoverRate!==null && p.turnoverRate!=='') return Number(p.turnoverRate);
    return TURNOVER_DEFAULTS[(p&&p.type)||'Studio']||400;
  }

  function cleaningFeeRateFor(propertyId){
    var p=props.find(function(x){return x.id===propertyId;});
    if(p && p.cleaningFeeRate!==undefined && p.cleaningFeeRate!==null && p.cleaningFeeRate!=='') return Number(p.cleaningFeeRate);
    return CLEANING_FEE_DEFAULT;
  }

  function buildCleaningTask(b,i){
    var p=props.find(function(x){return x.id===b.propertyId;});
    var defaultIdx = (p&&p.cleanerIndex!==undefined&&p.cleanerIndex!==null) ? p.cleanerIndex : (i%cleaners.length);
    var defaultPay = turnoverRateFor(b.propertyId);
    var pay = cleaningPayOverrides[b.id]!==undefined ? cleaningPayOverrides[b.id] : defaultPay;
    var defaultFee = cleaningFeeRateFor(b.propertyId);
    var ownerFee = cleaningFeeOverrides[b.id]!==undefined ? cleaningFeeOverrides[b.id] : defaultFee;
    return {
      id:b.id, date:b.checkOut, propertyId:b.propertyId, property:propShort(b.propertyId),
      guest:b.guest, type: 'Turnover', pay: pay, ownerFee: ownerFee, done: !!cleaningDone[b.id],
      cleanerIndex: cleaningOverrides[b.id]!==undefined ? cleaningOverrides[b.id] : defaultIdx
    };
  }

  function computeCleaningTasks(startDate,days){
    var end=addDays(startDate,days);
    return bookings.filter(function(b){return b.checkOut>=startDate && b.checkOut<end;})
      .sort(function(a,b){return a.checkOut===b.checkOut ? propName(a.propertyId).localeCompare(propName(b.propertyId)) : a.checkOut.localeCompare(b.checkOut);})
      .map(function(b,i){return buildCleaningTask(b,i);});
  }

  function saturdayOnOrBefore(iso){
    var d=new Date(iso+'T00:00:00');
    var day=d.getDay(); // Sun=0 ... Sat=6
    var diff=(day+1)%7; // days since most recent Saturday
    d.setDate(d.getDate()-diff);
    return isoLocal(d);
  }

  function computeCleaningTasksForWeek(weekStart){
    return computeCleaningTasks(weekStart,7);
  }

  function computePayroll(weekStart){
    var tasks=computeCleaningTasksForWeek(weekStart);
    return cleaners.map(function(name,idx){
      var mine=tasks.filter(function(t){return t.cleanerIndex===idx;});
      var pay=mine.reduce(function(s,t){return s+t.pay;},0);
      return {name:name,idx:idx,jobs:mine.length,pay:pay};
    });
  }

  function computeMonthlyPayrollBreakdown(mk){
    var firstOfMonth=mk+'-01';
    var daysInMo=new Date(Number(mk.slice(0,4)),Number(mk.slice(5,7)),0).getDate();
    var lastOfMonth=mk+'-'+(daysInMo<10?'0':'')+daysInMo;
    var d=saturdayOnOrBefore(firstOfMonth);
    if(d<firstOfMonth) d=addDays(d,7);
    var weeks=[];
    while(d<=lastOfMonth){
      weeks.push(d);
      d=addDays(d,7);
    }
    return weeks.map(function(weekStart,idx){
      var perCleaner=computePayroll(weekStart);
      var total=perCleaner.reduce(function(s,p){return s+p.pay;},0);
      var jobs=perCleaner.reduce(function(s,p){return s+p.jobs;},0);
      return {weekNum:idx+1, weekStart:weekStart, weekEnd:addDays(weekStart,6), perCleaner:perCleaner, total:total, jobs:jobs};
    });
  }

  function maintenanceStatus(lastDate,intervalMonths){
    if(!lastDate) return {status:'Never logged', next:null, tone:'rust'};
    var next=addMonths(lastDate,intervalMonths);
    var t=today();
    if(next<t) return {status:'Overdue', next:next, tone:'rust'};
    if(next<=addDays(t,14)) return {status:'Due soon', next:next, tone:'amber'};
    return {status:'OK', next:next, tone:'green'};
  }

    ctrl.appendChild(el('span',{},['month(s), based on the last \u201c'+category+'\u201d expense logged per property.']));
    panel.appendChild(ctrl);

    if(props.length===0){panel.appendChild(el('div',{class:'empty'},['Add properties first.']));return;}
    var tbl=el('table');
    tbl.appendChild(el('thead',{},[el('tr',{},[el('th',{},['Property']),el('th',{},['Last cleaned']),el('th',{},['Next due']),el('th',{},['Status'])])]));
    var tb=el('tbody');
    var rows=props.map(function(p){
      var last=lastServiceDate(p.id,category);
      var st=maintenanceStatus(last,maintenanceIntervals[intervalKey]);
      return {p:p,last:last,st:st};
    }).sort(function(a,b){
      var order={'Overdue':0,'Never logged':0,'Due soon':1,'OK':2};
      return order[a.st.status]-order[b.st.status];
    });
    rows.forEach(function(r){
      var toneMap={rust:'background:var(--rust-l);color:var(--rust)',amber:'background:var(--amber-l);color:var(--amber)',green:'background:var(--green-l);color:var(--green)'};
      tb.appendChild(el('tr',{},[
        el('td',{},[propShort(r.p.id)]),
        el('td',{class:'mono'},[r.last||'\u2014']),
        el('td',{class:'mono'},[r.st.next||'\u2014']),
        el('td',{},[el('span',{class:'badge',style:toneMap[r.st.tone]},[r.st.status])])
      ]));
    });
    tbl.appendChild(tb);
    panel.appendChild(el('div',{class:'table-scroll'},[tbl]));
  }

  function renderMaintenance(panel){
    panel.appendChild(el('div',{class:'section-title'},['Maintenance reminders']));
    panel.appendChild(el('div',{style:'font-size:12px;color:var(--muted);margin-bottom:4px'},['Log a \u201cCleaning\u201d category expense (Aircon cleaning / Grease trap) from the Expenses tab whenever a service is done \u2014 these reminders track from that date.']));
    renderMaintenanceRow(panel,'Aircon cleaning','Aircon cleaning','aircon');
    renderMaintenanceRow(panel,'Grease trap cleaning','Grease trap','grease');
  }

  function renderBackup(panel){
    panel.appendChild(el('div',{class:'section-title'},['Backup and restore']));
    panel.appendChild(el('div',{style:'font-size:13px;color:var(--muted);margin-bottom:16px;max-width:560px'},[
      'Download a full backup of everything in this dashboard \u2014 properties, bookings, expenses, cleaners, rates, and reminder settings \u2014 as a single file. Keep a copy somewhere safe (email it to yourself, save to Google Drive). If this device is lost or the data here is ever cleared, use Restore on another copy of this dashboard to bring everything back.'
    ]));

    var card=el('div',{style:'background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:560px'});
    card.appendChild(el('div',{style:'font-weight:500;font-size:14px;margin-bottom:4px'},['Create backup']));
    card.appendChild(el('div',{style:'font-size:12px;color:var(--muted);margin-bottom:12px'},[
      props.length+' properties \u00b7 '+bookings.length+' bookings \u00b7 '+expenses.length+' expenses \u00b7 '+cleaners.length+' cleaners'
    ]));
    card.appendChild(el('button',{onclick:function(){
      var backup={
        version:1, exportedAt:new Date().toISOString(),
        properties:props, bookings:bookings, expenses:expenses,
        cleaners:cleaners, cleaningOverrides:cleaningOverrides, cleaningPayOverrides:cleaningPayOverrides, cleaningFeeOverrides:cleaningFeeOverrides, cleaningDone:cleaningDone, dismissedConflicts:dismissedConflicts,
        maintenanceIntervals:maintenanceIntervals
      };
      var blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
      triggerDownload(blob,'dashboard-backup-'+today()+'.json');
    }},['Download backup file']));
    panel.appendChild(card);

    var restoreCard=el('div',{style:'background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:560px;margin-top:16px'});
    restoreCard.appendChild(el('div',{style:'font-weight:500;font-size:14px;margin-bottom:4px'},['Restore from backup']));
    restoreCard.appendChild(el('div',{style:'font-size:12px;color:var(--muted);margin-bottom:12px'},['This replaces everything currently in this dashboard with what\u2019s in the backup file. Only do this if you mean to overwrite current data.']));
    var fileInput=el('input',{type:'file',accept:'.json'});
    var statusSpan=el('div',{style:'font-size:12px;color:var(--muted);margin-top:8px'});
    fileInput.addEventListener('change',function(){
      var f=fileInput.files[0]; if(!f)return;
      var reader=new FileReader();
      reader.onload=function(){
        try{
          var data=JSON.parse(String(reader.result));
          if(!data||typeof data!=='object') throw new Error('bad file');
          props = data.properties||[];
          bookings = data.bookings||[];
          expenses = data.expenses||[];
          cleaners = data.cleaners||['Cleaner A','Cleaner B','Cleaner C','Cleaner D'];
          cleaningOverrides = data.cleaningOverrides||{};
          cleaningPayOverrides = data.cleaningPayOverrides||{};
          cleaningFeeOverrides = data.cleaningFeeOverrides||{};
          dismissedConflicts = data.dismissedConflicts||{};
          cleaningDone = data.cleaningDone||{};
          maintenanceIntervals = data.maintenanceIntervals||{aircon:4,grease:1};
          Promise.all([
            save('properties',props), save('bookings',bookings), save('expenses',expenses),
            save('cleaners',cleaners), save('cleaningOverrides',cleaningOverrides),
            save('cleaningPayOverrides',cleaningPayOverrides), save('cleaningFeeOverrides',cleaningFeeOverrides), save('cleaningDone',cleaningDone), save('dismissedConflicts',dismissedConflicts), save('maintenanceIntervals',maintenanceIntervals)
          ]).then(function(){
            statusSpan.textContent='Restored: '+props.length+' properties, '+bookings.length+' bookings, '+expenses.length+' expenses.';
            render();
          });
        }catch(err){
          statusSpan.textContent='Could not read that file \u2014 make sure it\u2019s a backup downloaded from this dashboard.';
        }
      };
      reader.readAsText(f);
    });
    restoreCard.appendChild(fileInput);
    restoreCard.appendChild(statusSpan);
    panel.appendChild(restoreCard);
  }

  function render(){
    var root=document.getElementById('app');
    root.innerHTML='';
    if(!loaded){root.appendChild(el('div',{class:'empty'},['Loading\u2026']));return;}
    renderTopbar(root);
    renderTabs(root);
    var panel=el('div',{class:'panel'});
    if(activeTab==='overview')renderOverview(panel);
    else if(activeTab==='properties')renderProperties(panel);
    else if(activeTab==='bookings')renderBookings(panel);
    else if(activeTab==='expenses')renderExpenses(panel);
    else if(activeTab==='owner')renderOwnerReport(panel);
    else if(activeTab==='earnings')renderMyEarnings(panel);
    else if(activeTab==='cleaning')renderCleaningSchedule(panel);
    else if(activeTab==='maintenance')renderMaintenance(panel);
    else if(activeTab==='backup')renderBackup(panel);
    root.appendChild(panel);
  }

  document.addEventListener('focusin', function(ev){
    var t = ev.target;
    if (t && (t.tagName==='INPUT' || t.tagName==='SELECT' || t.tagName==='TEXTAREA')) {
      setTimeout(function(){
        t.scrollIntoView({block:'center', behavior:'smooth'});
      }, 300);
    }
  });

  load();
})();
</script>
</body>
</html>
