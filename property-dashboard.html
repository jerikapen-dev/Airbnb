<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MJP Property Management</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E6259">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MJP Property">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --paper:#FBFBFA; --paper-raised:#FFFFFF;
  --ink:#1C1C1A; --ink-soft:#8C8C86;
  --line:#EBEAE6; --line-soft:#F3F2EF;
  --accent:#3E6259; --accent-l:#EEF2F0;
  --amber:#966B33; --amber-l:#F7F0E6;
  --green:#3F6B4E; --green-l:#EDF3EE;
  --rust:#9C4A3C; --rust-l:#F7ECE9;
  --teal:var(--accent); --teal-l:var(--accent-l); --teal-dark:#2E4A43;
  --muted:var(--ink-soft);
  --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper)}
#app{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;max-width:1280px;margin:0 auto}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Fraunces',serif}
#app a{color:var(--accent);text-decoration-color:var(--line);text-underline-offset:3px}

.topbar{padding:32px 28px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin:0 0 4px}
.topbar h1{font-family:'Fraunces',serif;font-weight:500;font-size:24px;margin:0;letter-spacing:-.01em}
.brandmark{font-size:28px !important;font-weight:600 !important;letter-spacing:-.02em}
.brandmark .hash{color:var(--accent)}
.topbar p{margin:4px 0 0;color:var(--ink-soft);font-size:13px}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:4px 28px 24px;border-bottom:1px solid var(--line)}
.metric{padding:10px 20px 10px 0;border-left:1px solid var(--line)}
.metric:first-child{border-left:none;padding-left:0}
.metric .lbl{font-size:11px;color:var(--ink-soft);letter-spacing:.02em}
.metric .val{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:500;margin-top:4px;letter-spacing:-.01em}

.tabs{display:flex;gap:20px;padding:0 28px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:13px 0;font-size:13.5px;font-weight:450;cursor:pointer;color:var(--ink-soft);white-space:nowrap;-webkit-user-select:none;user-select:none;border-bottom:2px solid transparent;transition:color .12s ease,border-color .12s ease}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

.panel{padding:26px 28px 90vh}
.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:11px;letter-spacing:.02em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;white-space:nowrap;background:var(--accent-l);color:var(--accent)}

.section-title{font-family:'Fraunces',serif;font-size:16px;font-weight:500;margin:0 0 14px;letter-spacing:-.01em}

form.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:0 0 20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
form.row .field{display:flex;flex-direction:column;gap:5px;flex:1 1 140px;min-width:120px}
form.row label{font-size:11px;color:var(--ink-soft)}

input,select{font-family:'Inter',sans-serif;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-raised);color:var(--ink);min-height:44px;width:100%;transition:border-color .12s ease}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{min-height:auto;width:auto;flex-shrink:0}

button{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;min-height:42px;-webkit-user-select:none;user-select:none;transition:opacity .12s ease}
button:hover{opacity:.82}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{background:var(--accent-l);border-color:var(--accent-l);opacity:1}
button.small{padding:7px 12px;font-size:12px;min-height:34px}
button:disabled{opacity:.35;cursor:default;pointer-events:none}

.empty{color:var(--ink-soft);font-size:13px;padding:32px 20px;text-align:center}

@media (max-width:820px){
  .metrics{grid-template-columns:repeat(2,1fr);row-gap:16px}
  .metric:nth-child(2n+1){border-left:none;padding-left:0}
  .topbar{padding:24px 18px 16px}
  .tabs{padding:0 18px;gap:16px}
  .panel{padding:18px 18px 90vh}
  .metric .val{font-size:17px}
  form.row .field{flex:1 1 100%}
}
@media (max-width:520px){
  .metrics{grid-template-columns:1fr 1fr}
  .topbar{flex-direction:column;align-items:flex-start}
  .topbar button{width:100%}
}

/* ---- layout polish ---- */
#app{max-width:1280px}
.tabs{gap:0;align-items:stretch}
.tab-group{display:flex;align-items:stretch;gap:18px;padding-right:18px;margin-right:18px;border-right:1px solid var(--line)}
.tab-group:last-child{border-right:none}
.tab-glabel{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);align-self:center;opacity:.8;white-space:nowrap}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 16px}
.page-title{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0;letter-spacing:-.01em}
.page-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpi{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi-l{font-size:11px;color:var(--ink-soft);letter-spacing:.02em}
.kpi-v{font-size:21px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
.kpi-s{font-size:11px;color:var(--ink-soft);margin-top:2px}
.seg{display:inline-flex;background:var(--line-soft);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-b{background:transparent;border:none;color:var(--ink-soft);font-size:13px;padding:7px 14px;min-height:34px;border-radius:6px;font-weight:500}
.seg-b:hover{opacity:1;color:var(--ink)}
.seg-b.on{background:var(--paper-raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.subnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tb-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:12px;border-radius:3px;border:1px solid var(--line)}
.lg-open{background:#fff}.lg-manual{background:#fff;border:1.5px solid var(--accent)}
.lg-booked{background:var(--accent);border-color:var(--accent)}
.lg-blocked{background:repeating-linear-gradient(45deg,#E4E3DE 0 3px,#F3F2EF 3px 6px)}
.lg-event{background:#fff;box-shadow:inset 0 -3px 0 var(--amber)}
.lg-behind{background:#fff;position:relative}
.lg-behind:after{content:'';position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;background:var(--rust)}
.mc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-raised)}
table.mc{border-collapse:separate;border-spacing:0;min-width:0;width:auto;font-size:12px}
.mc th,.mc td{padding:0;border-bottom:1px solid var(--line-soft)}
.mc .mc-unit{position:sticky;left:0;z-index:2;background:var(--paper-raised);min-width:150px;max-width:170px;padding:8px 12px;border-right:1px solid var(--line);text-align:left}
.mc thead th{background:var(--paper);font-weight:500;color:var(--ink-soft)}
.mc thead .mc-unit{background:var(--paper);z-index:3}
.mc-month th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:7px 8px;border-left:1px solid var(--line)}
.mc-days th{text-align:center;padding:5px 0;min-width:56px;width:56px}
.mc-days th.we{background:#F3F2EF}
.mc-days th.today .dn{background:var(--ink);color:#fff;border-radius:10px;padding:0 6px}
.mc-days th.ev{box-shadow:inset 0 -3px 0 var(--amber)}
.mc-days .dw{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.mc-days .dn{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink);display:inline-block;margin-top:1px}
.mc-name{font-weight:600;color:var(--ink);text-decoration:none;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-meta{font-size:10.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap}
.mc-c{height:46px;min-width:56px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;position:relative;border-left:1px solid var(--line-soft);transition:background .1s}
.c-we{background:#FAF9F6}
.c-open:hover{background:var(--accent-l)}
.c-manual{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600;color:var(--teal-dark)}
.c-event{box-shadow:inset 0 -3px 0 var(--amber)}
.c-manual.c-event{box-shadow:inset 0 0 0 1.5px var(--accent),inset 0 -4px 0 var(--amber)}
.c-behind:after{content:'';position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--rust)}
.c-booked{background:var(--accent);color:#fff;font-family:'Inter',sans-serif;font-size:11px;text-align:left;padding-left:6px;border-left-color:var(--accent);white-space:nowrap;overflow:visible}
.c-booked.c-start{border-left:3px solid var(--teal-dark)}
.c-blocked{background:repeating-linear-gradient(45deg,#E4E3DE 0 4px,#F3F2EF 4px 8px)}
.c-sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100vw;background:var(--paper-raised);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.08);z-index:50;display:flex;flex-direction:column;font-family:'Inter',sans-serif;color:var(--ink)}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 20px 12px;border-bottom:1px solid var(--line)}
.dr-eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.dr-title{font-family:'Fraunces',serif;font-size:19px;font-weight:500;margin-top:2px}
.dr-body{padding:16px 20px 40px;overflow-y:auto;flex:1}
.dr-status{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:12px}
.st-booked{background:var(--accent-l);color:var(--accent)}.st-blocked{background:var(--line-soft);color:var(--ink-soft)}
.dr-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.dr-row span:first-child{color:var(--ink-soft)}
.dr-price{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.dr-l{font-size:11px;color:var(--ink-soft)}
.dr-big{font-size:30px;font-weight:500;letter-spacing:-.02em}
.dr-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:18px 0 8px}
.dr-break{border:1px solid var(--line);border-radius:var(--radius-sm)}
.dr-br{font-size:12.5px;padding:7px 10px;border-top:1px solid var(--line-soft)}
.dr-br.first{border-top:none;font-weight:500}
.dr-note{font-size:12px;color:var(--ink-soft);margin-top:10px}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .tab-group{gap:14px;padding-right:14px;margin-right:14px}
  .drawer{top:auto;width:100%;height:78vh;border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0}
  .mc .mc-unit{min-width:110px;max-width:120px;padding:6px 8px}
}
@media print{
  body{background:#fff}
  #app{max-width:none}
  .topbar,.metrics,.tabs,form.row{display:none !important}
  button:not(.print-keep){display:none !important}
  .panel{padding:0}
}
</style>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-storage-compat.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var LS_PREFIX='pmDashboard:';
  var fsCache={}, fsDocRef=null, fsReady=false, currentUser=null, fsDb=null, fsUid=null, fsStorage=null;

  var storage={
    get:function(key){
      if(fsReady){
        return Promise.resolve(fsCache[key]!==undefined ? {key:key,value:fsCache[key]} : null);
      }
      try{
        var v=localStorage.getItem(LS_PREFIX+key);
        return Promise.resolve(v===null?null:{key:key,value:v});
      }catch(e){ return Promise.reject(e); }
    },
    set:function(key,value){
      if(fsReady && fsDocRef){
        fsCache[key]=value;
        var payload={}; payload[key]=value;
        return fsDocRef.set(payload,{merge:true}).then(function(){return {key:key,value:value};});
      }
      try{
        localStorage.setItem(LS_PREFIX+key,value);
        return Promise.resolve({key:key,value:value});
      }catch(e){ return Promise.reject(e); }
    }
  };

  function getSavedFirebaseConfig(){
    try{ var raw=localStorage.getItem('pmDashboard:firebaseConfig'); return raw?JSON.parse(raw):null; }catch(e){ return null; }
  }
  function saveFirebaseConfig(cfg){
    try{ localStorage.setItem('pmDashboard:firebaseConfig', JSON.stringify(cfg)); }catch(e){}
  }

  function gateShell(title,subtitle,bodyEl){
    var wrap=document.createElement('div');
    wrap.style.cssText='max-width:420px;margin:60px auto;padding:0 20px;font-family:Inter,sans-serif;color:#1C1C1A';
    var h=document.createElement('div');
    h.style.cssText='font-family:Fraunces,serif;font-size:22px;font-weight:500;margin-bottom:6px';
    h.textContent=title;
    var p=document.createElement('div');
    p.style.cssText='font-size:13px;color:#8C8C86;margin-bottom:20px;line-height:1.5';
    p.textContent=subtitle;
    wrap.appendChild(h); wrap.appendChild(p); wrap.appendChild(bodyEl);
    return wrap;
  }
  function gInput(placeholder,type){
    var i=document.createElement('input');
    i.placeholder=placeholder; i.type=type||'text';
    i.style.cssText='width:100%;font-size:16px;padding:10px;border:1px solid #EBEAE6;border-radius:6px;margin-bottom:10px;box-sizing:border-box';
    return i;
  }
  function gButton(label,onclick){
    var b=document.createElement('button');
    b.textContent=label;
    b.style.cssText='width:100%;font-size:14px;font-weight:500;padding:11px;border-radius:6px;border:1px solid #1C1C1A;background:#1C1C1A;color:#fff;cursor:pointer;margin-top:4px';
    b.addEventListener('click',onclick);
    return b;
  }
  function gError(msg){
    var e=document.createElement('div');
    e.style.cssText='color:#9C4A3C;font-size:12px;margin-top:8px';
    e.textContent=msg;
    return e;
  }

  function renderConfigGate(){
    var app=document.getElementById('app');
    var body=document.createElement('div');
    var ta=document.createElement('textarea');
    ta.placeholder='Paste your Firebase config object here (from the Firebase Console \u2192 Project settings \u2192 your web app)';
    ta.style.cssText='width:100%;height:140px;font-size:13px;font-family:monospace;padding:10px;border:1px solid #EBEAE6;border-radius:6px;margin-bottom:10px;box-sizing:border-box';
    body.appendChild(ta);
    var errBox=document.createElement('div');
    body.appendChild(errBox);
    body.appendChild(gButton('Save and continue',function(){
      errBox.innerHTML='';
      try{
        var text=ta.value.trim().replace(/^const\s+firebaseConfig\s*=\s*/,'').replace(/;\s*$/,'');
        var cfg=new Function('return '+text)();
        if(!cfg || !cfg.apiKey || !cfg.projectId){ throw new Error('missing fields'); }
        saveFirebaseConfig(cfg);
        location.reload();
      }catch(e){
        errBox.appendChild(gError('Could not read that config \u2014 paste the whole object exactly as copied from Firebase, including the curly braces.'));
      }
    }));
    app.innerHTML='';
    app.appendChild(gateShell('MJP Property Management \u2014 connect this device','One-time setup, per device. Paste the config object from your Firebase project (Project settings \u2192 General \u2192 Your apps \u2192 SDK setup and configuration).',body));
  }

  function renderAuthGate(auth){
    var app=document.getElementById('app');
    var body=document.createElement('div');
    var emailInp=gInput('Email','email');
    var passInp=gInput('Password','password');
    body.appendChild(emailInp); body.appendChild(passInp);
    var errBox=document.createElement('div');
    var signInBtn=gButton('Sign in',function(){
      errBox.innerHTML='';
      auth.signInWithEmailAndPassword(emailInp.value.trim(),passInp.value).catch(function(e){
        errBox.appendChild(gError(e.message||'Could not sign in.'));
      });
    });
    var signUpBtn=gButton('Create account (first time only)',function(){
      errBox.innerHTML='';
      auth.createUserWithEmailAndPassword(emailInp.value.trim(),passInp.value).catch(function(e){
        errBox.appendChild(gError(e.message||'Could not create account.'));
      });
    });
    signUpBtn.style.background='#fff'; signUpBtn.style.color='#1C1C1A';
    var forgotBtn=document.createElement('button');
    forgotBtn.textContent='Forgot password / not sure what email I used';
    forgotBtn.type='button';
    forgotBtn.style.cssText='width:100%;font-size:12px;padding:8px;border:none;background:transparent;color:#8C8C86;text-decoration:underline;cursor:pointer;margin-top:10px';
    var forgotStatus=document.createElement('div');
    forgotBtn.addEventListener('click',function(){
      errBox.innerHTML=''; forgotStatus.innerHTML='';
      var email=emailInp.value.trim();
      if(!email){
        forgotStatus.appendChild(gError('Type the email you think you used above first, then tap this again — we’ll send a reset link to it if an account exists.'));
        return;
      }
      auth.sendPasswordResetEmail(email).then(function(){
        var ok=document.createElement('div');
        ok.style.cssText='color:#3E6259;font-size:12px;margin-top:8px';
        ok.textContent='If an account exists for '+email+', a password reset link was just sent to it. Check that inbox (and spam folder).';
        forgotStatus.appendChild(ok);
      }).catch(function(e){
        forgotStatus.appendChild(gError(e.message||'Could not send reset email.'));
      });
    });
    body.appendChild(signInBtn); body.appendChild(signUpBtn); body.appendChild(errBox);
    body.appendChild(forgotBtn); body.appendChild(forgotStatus);
    app.innerHTML='';
    app.appendChild(gateShell('Sign in to MJP Property Management','Use the same email and password on every device to see the same data everywhere. If you already created an account on another device, use "Sign in" here — do not press "Create account" again, or you’ll start a second, empty account. Not sure which email you used the first time? Check the Account section on your original, working device — it now shows the exact email that device is signed in with.',body));
  }

  function startFirestoreSync(db,uid){
    fsDb=db; fsUid=uid;
    fsDocRef=db.collection('dashboards').doc(uid);
    fsDocRef.onSnapshot(function(snap){
      fsCache=snap.exists?(snap.data()||{}):{};
      fsReady=true;
      load();
    },function(err){
      console.error('Firestore sync error',err);
    });
  }

  function backupSlotNow(){
    return new Date().getHours()<12 ? 'AM' : 'PM';
  }
  function maybeAutoBackup(){
    if(!fsReady || !fsDb || !fsUid) return;
    var todayStr=today();
    var slot=backupSlotNow();
    var periodKey=todayStr+'_'+slot;
    var lastKey='pmDashboard:lastAutoBackupPeriod:'+fsUid;
    var last=null;
    try{ last=localStorage.getItem(lastKey); }catch(e){}
    if(last===periodKey) return;
    var backupDoc={
      date:todayStr, slot:slot, periodKey:periodKey, savedAt:new Date().toISOString(),
      properties:props, bookings:bookings, expenses:expenses, cleaners:cleaners,
      cleaningOverrides:cleaningOverrides, cleaningPayOverrides:cleaningPayOverrides,
      cleaningFeeOverrides:cleaningFeeOverrides, cleaningDone:cleaningDone,
      dismissedConflicts:dismissedConflicts, maintenanceIntervals:maintenanceIntervals,
      pricing:pricing, calSync:calSync
    };

  function applySnapshot(json){

  }

  function payInfo(b){
    var total=Number(b.amount||0);
    var hasSheet=(b.amountDue!==undefined&&b.amountDue!==null&&b.amountDue!=='')||(b.amountPaid!==undefined&&b.amountPaid!==null&&b.amountPaid!=='');
    var due=hasSheet?Number(b.amountDue||0):0;
    var paid=hasSheet?(b.amountPaid!==undefined&&b.amountPaid!==''?Number(b.amountPaid||0):total-due):total;
    if(hasSheet && !paid && !due) paid=total; // nothing recorded on the sheet = treat as fully paid (e.g. Airbnb collects)
    return {total:total,paid:paid,due:due,tracked:hasSheet};
  }

  function suggestShortcut(name){

  function toISODate(v){
    if(!v)return '';
    v=String(v).trim();
    if(/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
    var d=new Date(v);
    if(isNaN(d.getTime()))return '';
    var y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
    return y+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
  }

  function parseCSV(text){
    var rows=[]; var cur=['']; var row=[]; var inQuotes=false;
    var i=0,c;
    function pushField(){row.push(cur.join(''));cur=[];}
    function pushRow(){pushField();rows.push(row);row=[];}
    while(i<text.length){
      c=text[i];
      if(inQuotes){
        if(c==='"'){ if(text[i+1]==='"'){cur.push('"');i+=2;continue;} inQuotes=false;i++;continue;}
        cur.push(c);i++;continue;
      }else{
        if(c==='"'){inQuotes=true;i++;continue;}
        if(c===','){pushField();i++;continue;}
        if(c==='\r'){i++;continue;}
        if(c==='\n'){pushRow();i++;continue;}
        cur.push(c);i++;continue;
      }
    }
    if(cur.length||row.length){pushRow();}
    rows=rows.filter(function(r){return r.length>1||r[0]!=='';});
    if(rows.length===0)return [];
    var headers=rows[0].map(function(h){return h.trim().toLowerCase();});
    return rows.slice(1).map(function(r){
      var obj={};
      headers.forEach(function(h,idx){obj[h]=r[idx]!==undefined?r[idx].trim():'';});
      return obj;
    });
  }

  function pick(obj,keys){
    for(var i=0;i<keys.length;i++){ if(obj[keys[i]]!==undefined && obj[keys[i]]!=='') return obj[keys[i]]; }
    return '';
  }

  function bookingSignature(guest,checkIn,checkOut,amount){

  function parseBookingsCandidates(text,channelOverride){
    var rows=parseCSV(text);
    var existingSignatures={};
    var existingByGuestDates={};
    bookings.forEach(function(b){
      existingSignatures[bookingSignature(b.guest,b.checkIn,b.checkOut,b.amount)]=true;
      var gdKey=(b.guest||'').trim().toLowerCase()+'|'+b.checkIn+'|'+b.checkOut;
      existingByGuestDates[gdKey]=b.amount;
    });
    var candidates=[];
    rows.forEach(function(r){
      var propRaw=pick(r,['property','listing','property name','unit']);
      var propertyId=findPropertyIdByNameOrShortcut(propRaw) || (props.length===1?props[0].id:null);
      var checkIn=toISODate(pick(r,['check-in','checkin','start date','arrival']));
      var checkOut=toISODate(pick(r,['check-out','checkout','end date','departure']));
      // Prefer 'net' when present (e.g. Booking.com payout exports list gross 'Amount' plus
      // deductions plus 'Net') since your commission is calculated on the actual net payout,
      // same as Airbnb's 'Amount' column (which is already net of Airbnb's own service fee).
      var amount=Number(pick(r,['net','amount','payout','gross earnings','earnings','total payout','price']).toString().replace(/[^0-9.\-]/g,''))||0;
      var guest=pick(r,['guest','guest name']);
      var phone=pick(r,['phone','phone number','contact number','mobile']);
      var email=pick(r,['email','email address']);
      var channel=(channelOverride && channelOverride!=='auto') ? channelOverride : pick(r,['channel','platform','source']);
      if(!channel){
        if(r['service fee']!==undefined || r['gross earnings']!==undefined) channel='Airbnb';
        else if(r['payments service provider']!==undefined || r['booking number']!==undefined) channel='Booking.com';
        else channel='Other';
      }
      var status='ok', reason='';
      if(!checkIn||!checkOut){ status='invalid'; reason='Missing check-in/check-out'; }
      else if(!propertyId){ status='invalid'; reason='No matching property (add \u201c'+(propRaw||'\u2014')+'\u201d as a property or shortcut first)'; }
      else if(bookings.some(function(b){return b.source==='ical' && b.propertyId===propertyId && b.checkIn===checkIn && b.checkOut===checkOut;})){
        var ph=bookings.find(function(b){return b.source==='ical' && b.propertyId===propertyId && b.checkIn===checkIn && b.checkOut===checkOut;});
        reason='Fills in the calendar-sync placeholder for these dates (no duplicate is created)';
        var replaceId=ph.id;
      }
      else{
        var sig=bookingSignature(guest,checkIn,checkOut,amount);
        var gdKey=(guest||'').trim().toLowerCase()+'|'+checkIn+'|'+checkOut;
        if(existingSignatures[sig]){ status='duplicate'; reason='Same guest, dates, and amount already on file'; }
        else if(existingByGuestDates[gdKey]!==undefined){
          status='review';
          reason='Same guest & dates already on file, but a different amount (on file: \u20B1'+Number(existingByGuestDates[gdKey]).toFixed(0)+', this file: \u20B1'+amount.toFixed(0)+') \u2014 check before importing';
        }
        else{ existingSignatures[sig]=true; existingByGuestDates[gdKey]=amount; }
      }
      candidates.push({
        propertyId:propertyId, propertyLabel:propertyId?propShort(propertyId):(propRaw||'\u2014'),
        propRaw:propRaw, missingProperty:(!propertyId && !!checkIn && !!checkOut),
        guest:guest||'Guest', phone:phone, email:email, channel:channel,
        checkIn:checkIn, checkOut:checkOut, amount:amount,
        status:status, reason:reason, selected:(status==='ok'), replaceId:replaceId||null
      });
      replaceId=null;
    });
    return candidates;
  }

  function commitBookingsCandidates(candidates){
    var toAdd=candidates.filter(function(c){ return c.selected && (c.status==='ok'||c.status==='review'); });
    if(toAdd.length===0) return 0;
    pushUndoSnapshot();
    toAdd.forEach(function(c){
      if(c.replaceId){
        var ph=bookings.find(function(b){return b.id===c.replaceId;});
        if(ph){ ph.guest=c.guest; ph.phone=c.phone||ph.phone; ph.email=c.email; ph.channel=c.channel||ph.channel; ph.amount=c.amount; delete ph.source; return; }
      }
      bookings.push({id:uid(),propertyId:c.propertyId,guest:c.guest,phone:c.phone,email:c.email,channel:c.channel,checkIn:c.checkIn,checkOut:c.checkOut,amount:c.amount,checkedIn:false,checkedOut:false});
    });
    save('bookings',bookings);
    return toAdd.length;
  }

  function detectDoubleBookings(){
    var conflicts=[];
    var byProp={};
    bookings.forEach(function(b){ (byProp[b.propertyId]=byProp[b.propertyId]||[]).push(b); });
    Object.keys(byProp).forEach(function(pid){
      var list=byProp[pid].slice().sort(function(a,b){return a.checkIn.localeCompare(b.checkIn);});
      for(var i=0;i<list.length;i++){
        for(var j=i+1;j<list.length;j++){
          var a=list[i], b=list[j];
          if(a.checkIn<b.checkOut && b.checkIn<a.checkOut){
            conflicts.push({propertyId:pid, a:a, b:b});
          }
        }
      }
    });
    return conflicts;
  }

  function duplicateBookingIds(){
    var exactGroups={}, gdGroups={};
    bookings.forEach(function(b){
      var key=bookingSignature(b.guest,b.checkIn,b.checkOut,b.amount);
      (exactGroups[key]=exactGroups[key]||[]).push(b);
      var gdKey=(b.guest||'').trim().toLowerCase()+'|'+b.checkIn+'|'+b.checkOut;
      (gdGroups[gdKey]=gdGroups[gdKey]||[]).push(b);
    });
    var flagged={};
    Object.keys(exactGroups).forEach(function(key){
      if(exactGroups[key].length>1){
        exactGroups[key].forEach(function(b){ flagged[b.id]={count:exactGroups[key].length, exact:true}; });
      }
    });
    Object.keys(gdGroups).forEach(function(key){
      var group=gdGroups[key];
      if(group.length>1){
        var amounts={}; group.forEach(function(b){ amounts[Number(b.amount||0).toFixed(2)]=1; });
        if(Object.keys(amounts).length>1){
          group.forEach(function(b){ if(!flagged[b.id]) flagged[b.id]={count:group.length, exact:false}; });
        }
      }
    });
    return flagged;
  }

  function sameAmountBookingIds(){
    var groups={};
    bookings.forEach(function(b){
      var amt=Number(b.amount||0);
      if(!amt) return; // zero-amount rows (e.g. cleaning-only adjustments) aren't meaningful here
      var key=amt.toFixed(2);
      (groups[key]=groups[key]||[]).push(b);
    });
    var flagged={};
    Object.keys(groups).forEach(function(key){
      if(groups[key].length>1){
        groups[key].forEach(function(b){ flagged[b.id]=groups[key].length; });
      }
    });
    return flagged;
  }

  function autoDeleteExactDuplicates(){
    var groups={};
    bookings.forEach(function(b){
      var key=bookingSignature(b.guest,b.checkIn,b.checkOut,b.amount);
      (groups[key]=groups[key]||[]).push(b);
    });
    var toDelete={};
    Object.keys(groups).forEach(function(key){
      var group=groups[key];
      if(group.length>1){
        for(var i=1;i<group.length;i++){ toDelete[group[i].id]=true; }
      }
    });
    var count=Object.keys(toDelete).length;
    if(count===0) return 0;
    pushUndoSnapshot();
    bookings=bookings.filter(function(b){ return !toDelete[b.id]; });
    save('bookings',bookings);
    return count;
  }

  function upcomingVacancies(days){
    var t=today();
    var horizon=addDays(t,days);
    return props.filter(function(p){
      var hasUpcoming=bookings.some(function(b){return b.propertyId===p.id && b.checkOut>t && b.checkIn<horizon;});
      return !hasUpcoming;
    });
  }

  function computeAttentionItems(){

    var t=today();

    if(calSync.lastSync){ var calPend=calItemsNeedingBooking().length; if(calPend>0) items.push({type:'calendar', tone:'amber', text:calPend+' reservation'+(calPend===1?'':'s')+' on your Airbnb/Booking.com calendars not yet in Bookings (Calendar sync tab)'}); }
    if(calSync.sheet && calSync.sheet.lastFetch){ var shPend=sheetDiff().length; if(shPend>0) items.push({type:'sheet', tone:'amber', text:shPend+' update'+(shPend===1?'':'s')+' from your website bookings sheet waiting for approval (Calendar sync tab)'}); }
    var pendTotal=0; props.forEach(function(p){ pendTotal+=pendingUpdates(p.id,14); });
    if(pendTotal>0) items.push({type:'pricing', tone:'amber', text:pendTotal+' price change'+(pendTotal===1?'':'s')+' in the next 14 days not yet updated on Airbnb / Booking.com (Pricing tab)'});

    upcomingVacancies(14).forEach(function(p){
      items.push({type:'vacancy', tone:'amber', text:propShort(p.id)+' has no bookings in the next 14 days'});
    });

    props.forEach(function(p){
      var airconStatus=maintenanceStatus(lastServiceDate(p.id,'Aircon cleaning'), maintenanceIntervals.aircon);
      if(airconStatus.status==='Overdue') items.push({type:'maintenance', tone:'rust', text:propShort(p.id)+': aircon cleaning overdue'});
      var greaseStatus=maintenanceStatus(lastServiceDate(p.id,'Grease trap'), maintenanceIntervals.grease);
      if(greaseStatus.status==='Overdue') items.push({type:'maintenance', tone:'rust', text:propShort(p.id)+': grease trap cleaning overdue'});
    });

    bookings.filter(function(b){return b.checkOut<t && b.checkOut>=addDays(t,-14);}).forEach(function(b,i){
      var task=buildCleaningTask(b,i);
      if(!task.done){
        items.push({type:'cleaning', tone:'amber', text:propShort(b.propertyId)+': cleaning after '+b.guest+'\u2019s checkout ('+b.checkOut+') not marked done'});

  function monthTotals(propId,mk){
    var rev=bookings.filter(function(b){return b.propertyId===propId && monthKey(b.checkIn)===mk;})
      .reduce(function(s,b){return s+Number(b.amount||0);},0);
    var exp=expenses.filter(function(e){return e.propertyId===propId && monthKey(e.date)===mk;})
      .reduce(function(s,e){return s+Number(e.amount||0);},0);
    var nights=bookings.filter(function(b){return b.propertyId===propId && monthKey(b.checkIn)===mk;})
      .reduce(function(s,b){return s+Math.round((new Date(b.checkOut)-new Date(b.checkIn))/86400000);},0);
    var daysInMonth=new Date(Number(mk.slice(0,4)), Number(mk.slice(5,7)), 0).getDate();
    var occRate=daysInMonth>0 ? (nights/daysInMonth*100) : 0;
    var avgRate=nights>0 ? (rev/nights) : 0;
    return {rev:rev,exp:exp,net:rev-exp,nights:nights,occRate:occRate,avgRate:avgRate};
  }

  function overallTotals(){
    var mk=thisMonth();
    var rev=bookings.filter(function(b){return monthKey(b.checkIn)===mk;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
    var exp=expenses.filter(function(e){return monthKey(e.date)===mk;}).reduce(function(s,e){return s+Number(e.amount||0);},0);
    var occ=props.filter(function(p){return occupancyStatus(p.id).state==='occupied';}).length;
    return {rev:rev,exp:exp,net:rev-exp,occ:occ,total:props.length};
  }

  function ytdTotals(){
    var year=today().slice(0,4);
    var rev=bookings.filter(function(b){return b.checkIn.slice(0,4)===year;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
    var exp=expenses.filter(function(e){return e.date.slice(0,4)===year;}).reduce(function(s,e){return s+Number(e.amount||0);},0);
    return {rev:rev,exp:exp,net:rev-exp,year:year};
  }

  function lastFullMonthKey(){
    var t=new Date();
    var firstOfThisMonth=new Date(t.getFullYear(),t.getMonth(),1);
    var lastDayPrevMonth=new Date(firstOfThisMonth.getTime()-86400000);
    return isoLocal(lastDayPrevMonth).slice(0,7);
  }

  function monthsFromTo(startKey,endKey){
    var months=[];
    var y=Number(startKey.slice(0,4)), m=Number(startKey.slice(5,7));
    var endY=Number(endKey.slice(0,4)), endM=Number(endKey.slice(5,7));
    while(y<endY || (y===endY && m<=endM)){
      months.push(y+'-'+(m<10?'0':'')+m);
      m++; if(m>12){m=1;y++;}
    }
    return months;
  }

  function monthAllPropsTotals(mk){
    var rev=bookings.filter(function(b){return monthKey(b.checkIn)===mk;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
    var exp=expenses.filter(function(e){return monthKey(e.date)===mk;}).reduce(function(s,e){return s+Number(e.amount||0);},0);
    return {rev:rev,exp:exp,net:rev-exp};
  }

  function computeRevenueSummary(){
    var start='2026-01';
    var end=lastFullMonthKey();
    if(end<start) return [];
    var months=monthsFromTo(start,end);
    var rows=months.map(function(mk){
      var t=monthAllPropsTotals(mk);
      return {month:mk,year:mk.slice(0,4),rev:t.rev,exp:t.exp,net:t.net};
    });
    return rows;
  }

  function mergeProperties(fromId,intoId){
    if(!fromId||!intoId||fromId===intoId) return {merged:0};
    var fromProp=props.find(function(p){return p.id===fromId;});
    var intoProp=props.find(function(p){return p.id===intoId;});
    if(!fromProp||!intoProp) return {merged:0};

    pushUndoSnapshot();

    var movedBookings=0, movedExpenses=0;
    bookings.forEach(function(b){ if(b.propertyId===fromId){ b.propertyId=intoId; movedBookings++; } });
    expenses.forEach(function(e){ if(e.propertyId===fromId){ e.propertyId=intoId; movedExpenses++; } });

    intoProp.aliases = intoProp.aliases || [];
    [fromProp.name, fromProp.shortcut].concat(fromProp.aliases||[]).forEach(function(n){
      if(n && intoProp.aliases.indexOf(n)===-1 && n.toLowerCase()!==intoProp.name.toLowerCase()) intoProp.aliases.push(n);
    });

    props=props.filter(function(p){return p.id!==fromId;});

    save('properties',props); save('bookings',bookings); save('expenses',expenses);
    return {merged:1, movedBookings:movedBookings, movedExpenses:movedExpenses, fromName:fromProp.name, intoName:intoProp.name};
  }

  function slugifyUsername(u){ return String(u||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function ownerPortalToken(username,pin){ return slugifyUsername(username)+'__'+String(pin||'').trim(); }
  function scopeMatchesProperty(scope,propertyId){
    if(scope==='ALL') return true;
    if(typeof scope==='string' && scope.indexOf('OWNER::')===0){
      var ownerName=scope.slice(7);
      return ownerPropertyIds(ownerName).indexOf(propertyId)>-1;
    }
    return propertyId===scope;
  }

  function computeOwnerReport(propertyId,mk){
    var relevantProps = reportScopeProps(propertyId);
    var bks = bookings.filter(function(b){return monthKey(b.checkIn)===mk && scopeMatchesProperty(propertyId,b.propertyId);});
    var exs = expenses.filter(function(e){return monthKey(e.date)===mk && scopeMatchesProperty(propertyId,e.propertyId);});
    var gross = bks.reduce(function(s,b){return s+Number(b.amount||0);},0);

    var mgmtFee = relevantProps.reduce(function(sum,p){
      var grossP = bks.filter(function(b){return b.propertyId===p.id;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
      return sum + grossP*mgmtRateFor(p.id);
    },0);

    var cleaningLaundry = relevantProps.reduce(function(sum,p){ return sum + computeCleaningFeeForMonth(p.id,mk); },0);

    var buckets={maintenance:0, replacement:0, toiletries:0, electricity:0, water:0, internet:0, condoDues:0, other:0};
    exs.forEach(function(e){
      if(e.ownExpense) return; // paid personally by the manager, never billed to the owner
      buckets[bucketFor(e.category)] += Number(e.amount||0);
    });

    var totalExp = cleaningLaundry + buckets.maintenance + buckets.replacement + buckets.toiletries + buckets.electricity + buckets.water + buckets.internet + buckets.condoDues + buckets.other;
    var netOwner = gross - mgmtFee - totalExp;
    function pct(v){ return gross>0 ? (v/gross*100) : 0; }
    return {gross:gross, mgmtFee:mgmtFee, maintenance:buckets.maintenance, replacement:buckets.replacement,
      toiletries:buckets.toiletries, electricity:buckets.electricity, water:buckets.water, internet:buckets.internet, condoDues:buckets.condoDues, other:buckets.other,
      cleaningLaundry:cleaningLaundry, totalExp:totalExp, netOwner:netOwner,
      mgmtPct:pct(mgmtFee), maintenancePct:pct(buckets.maintenance), replacementPct:pct(buckets.replacement),
      toiletriesPct:pct(buckets.toiletries), electricityPct:pct(buckets.electricity), waterPct:pct(buckets.water), internetPct:pct(buckets.internet), condoDuesPct:pct(buckets.condoDues),
      otherPct:pct(buckets.other), cleaningLaundryPct:pct(cleaningLaundry), totalExpPct:pct(totalExp)};
  }

  function computeMyEarnings(propertyId,mk){
    var relevantProps = propertyId==='ALL' ? props : props.filter(function(p){return p.id===propertyId;});
    var bks = bookings.filter(function(b){return monthKey(b.checkIn)===mk && (propertyId==='ALL'||b.propertyId===propertyId);});
    var exs = expenses.filter(function(e){return monthKey(e.date)===mk && (propertyId==='ALL'||e.propertyId===propertyId);});
    var gross = bks.reduce(function(s,b){return s+Number(b.amount||0);},0);

    var mgmtFee = relevantProps.reduce(function(sum,p){
      var grossP = bks.filter(function(b){return b.propertyId===p.id;}).reduce(function(s,b){return s+Number(b.amount||0);},0);
      return sum + grossP*mgmtRateFor(p.id);
    },0);

    var replacementBilled=0, replacementActual=0, maintenanceBilled=0, maintenanceActual=0, toiletriesBilled=0, toiletriesActual=0;
    var ownExpenseTotal=0;
    var ownExpenseByItem={};
    exs.forEach(function(e){
      if(e.ownExpense){
        var amt=Number(e.amount||0);
        ownExpenseTotal+=amt;
        var key=(e.item||e.category||'Other').trim();
        ownExpenseByItem[key]=(ownExpenseByItem[key]||0)+amt;
        return;
      }
      var bucket=bucketFor(e.category);
      var amt2=Number(e.amount||0);
      var actual=(e.actualCost!==undefined && e.actualCost!==null) ? Number(e.actualCost) : amt2;
      if(bucket==='replacement'){ replacementBilled+=amt2; replacementActual+=actual; }
      else if(bucket==='maintenance'){ maintenanceBilled+=amt2; maintenanceActual+=actual; }
      else if(bucket==='toiletries'){ toiletriesBilled+=amt2; toiletriesActual+=actual; }
    });
    var replacementMargin=replacementBilled-replacementActual;
    var maintenanceMargin=maintenanceBilled-maintenanceActual;
    var toiletriesMargin=toiletriesBilled-toiletriesActual;

    // Cleaning fee (billed to owner) and turnover pay (owed to cleaner) both run off checkout date, same as the Cleaning Schedule
    var checkoutsInMonth = bookings.filter(function(b){return monthKey(b.checkOut)===mk && (propertyId==='ALL'||b.propertyId===propertyId);});
    var cleaningLaundry=0, turnoverPaid=0;
    checkoutsInMonth.forEach(function(b,i){
      var task=buildCleaningTask(b,i);
      cleaningLaundry+=task.ownerFee;
      turnoverPaid+=task.pay;
    });

    var myEarnings = mgmtFee + cleaningLaundry + replacementMargin + maintenanceMargin + toiletriesMargin - turnoverPaid - ownExpenseTotal;
    return {gross:gross, mgmtFee:mgmtFee, cleaningLaundry:cleaningLaundry,
      ownExpenseTotal:ownExpenseTotal, ownExpenseByItem:ownExpenseByItem,
      replacementBilled:replacementBilled, replacementActual:replacementActual, replacementMargin:replacementMargin,
      maintenanceBilled:maintenanceBilled, maintenanceActual:maintenanceActual, maintenanceMargin:maintenanceMargin,
      toiletriesBilled:toiletriesBilled, toiletriesActual:toiletriesActual, toiletriesMargin:toiletriesMargin,
      turnoverPaid:turnoverPaid, myEarnings:myEarnings};
  }

  function turnoverRateFor(propertyId){
    var p=props.find(function(x){return x.id===propertyId;});
    if(p && p.turnoverRate!==undefined && p.turnoverRate!==null && p.turnoverRate!=='') return Number(p.turnoverRate);
    return TURNOVER_DEFAULTS[(p&&p.type)||'Studio']||400;
  }

  function cleaningFeeRateFor(propertyId){
    var p=props.find(function(x){return x.id===propertyId;});
    if(p && p.cleaningFeeRate!==undefined && p.cleaningFeeRate!==null && p.cleaningFeeRate!=='') return Number(p.cleaningFeeRate);
    return CLEANING_FEE_DEFAULT;
  }

  function defaultCleanerIndexFor(p,checkOutDate,i){
    if(p && p.cleanerSchedule && p.cleanerSchedule.length===7){
      var dow=new Date(checkOutDate+'T00:00:00').getDay(); // 0=Sun ... 6=Sat
      var scheduled=p.cleanerSchedule[dow];
      if(scheduled!==undefined && scheduled!==null && scheduled!=='') return Number(scheduled);
    }
    return (p&&p.cleanerIndex!==undefined&&p.cleanerIndex!==null) ? p.cleanerIndex : (i%cleaners.length);
  }

  function buildCleaningTask(b,i){
    var p=props.find(function(x){return x.id===b.propertyId;});
    var defaultIdx = defaultCleanerIndexFor(p,b.checkOut,i);
    var defaultPay = turnoverRateFor(b.propertyId);
    var pay = cleaningPayOverrides[b.id]!==undefined ? cleaningPayOverrides[b.id] : defaultPay;
    var defaultFee = cleaningFeeRateFor(b.propertyId);
    var ownerFee = cleaningFeeOverrides[b.id]!==undefined ? cleaningFeeOverrides[b.id] : defaultFee;
    return {
      id:b.id, date:b.checkOut, propertyId:b.propertyId, property:propShort(b.propertyId),
      guest:b.guest, type: 'Turnover', pay: pay, ownerFee: ownerFee, done: !!cleaningDone[b.id],
      cleanerIndex: cleaningOverrides[b.id]!==undefined ? cleaningOverrides[b.id] : defaultIdx
    };
  }

  function computeCleaningTasks(startDate,days){
    var end=addDays(startDate,days);
    return bookings.filter(function(b){return b.checkOut>=startDate && b.checkOut<end;})
      .sort(function(a,b){return a.checkOut===b.checkOut ? propName(a.propertyId).localeCompare(propName(b.propertyId)) : a.checkOut.localeCompare(b.checkOut);})
      .map(function(b,i){return buildCleaningTask(b,i);});
  }

  function saturdayOnOrBefore(iso){
    var d=new Date(iso+'T00:00:00');
    var day=d.getDay(); // Sun=0 ... Sat=6
    var diff=(day+1)%7; // days since most recent Saturday
    d.setDate(d.getDate()-diff);
    return isoLocal(d);
  }

  function computeCleaningTasksForWeek(weekStart){
    return computeCleaningTasks(weekStart,7);
  }

  function computePayroll(weekStart){
    var tasks=computeCleaningTasksForWeek(weekStart);
    return cleaners.map(function(name,idx){
      var mine=tasks.filter(function(t){return t.cleanerIndex===idx;});
      var pay=mine.reduce(function(s,t){return s+t.pay;},0);
      return {name:name,idx:idx,jobs:mine.length,pay:pay};
    });
  }

  function computeMonthlyPayrollBreakdown(mk){
    var firstOfMonth=mk+'-01';
    var daysInMo=new Date(Number(mk.slice(0,4)),Number(mk.slice(5,7)),0).getDate();
    var lastOfMonth=mk+'-'+(daysInMo<10?'0':'')+daysInMo;
    var d=saturdayOnOrBefore(firstOfMonth);
    if(d<firstOfMonth) d=addDays(d,7);
    var weeks=[];
    while(d<=lastOfMonth){
      weeks.push(d);
      d=addDays(d,7);
    }
    return weeks.map(function(weekStart,idx){
      var perCleaner=computePayroll(weekStart);
      var total=perCleaner.reduce(function(s,p){return s+p.pay;},0);
      var jobs=perCleaner.reduce(function(s,p){return s+p.jobs;},0);
      return {weekNum:idx+1, weekStart:weekStart, weekEnd:addDays(weekStart,6), perCleaner:perCleaner, total:total, jobs:jobs};
    });
  }

  function computeCleaningHistoryByMonth(){
    var monthTotals={};
    bookings.forEach(function(b,i){
      var mk=monthKey(b.checkOut);
      var task=buildCleaningTask(b,i);
      var m=monthTotals[mk]=monthTotals[mk]||{jobs:0, doneCount:0, pay:0, ownerFee:0};
      m.jobs++;
      if(task.done) m.doneCount++;
      m.pay+=task.pay;
      m.ownerFee+=task.ownerFee;
    });
    return Object.keys(monthTotals).sort().reverse().map(function(mk){
      var m=monthTotals[mk];
      return {month:mk, jobs:m.jobs, doneCount:m.doneCount, pay:m.pay, ownerFee:m.ownerFee};
    });
  }

  function lastServiceDate(propertyId,category){
    var matches=expenses.filter(function(e){return e.propertyId===propertyId && e.category===category;})
      .map(function(e){return e.date;}).sort();
    return matches.length ? matches[matches.length-1] : null;
  }

  function maintenanceStatus(lastDate,intervalMonths){
    if(!lastDate) return {status:'Never logged', next:null, tone:'rust'};
    var next=addMonths(lastDate,intervalMonths);
    var t=today();
    if(next<t) return {status:'Overdue', next:next, tone:'rust'};
    if(next<=addDays(t,14)) return {status:'Due soon', next:next, tone:'amber'};
    return {status:'OK', next:next, tone:'green'};
  }

  // ================= CALENDAR SYNC (iCal from Airbnb / Booking.com via your Google Apps Script) =================
  var calSync={proxyUrl:'',proxyKey:'',feeds:{},events:{},lastSync:'',lastErrors:{},dismissed:{}};
  var calSyncBusy=false, calSyncMsg='', calAutoTried=false;
  var FEEDS=[['airbnb','Airbnb'],['booking','Booking.com']];

  function normalizeCalSync(c){
    c=c||{};
    return {proxyUrl:c.proxyUrl||'',proxyKey:c.proxyKey||'',feeds:c.feeds||{},events:c.events||{},lastSync:c.lastSync||'',lastErrors:c.lastErrors||{},dismissed:c.dismissed||{},blocks:c.blocks||[],feedToken:c.feedToken||'',includeChannelBookings:c.includeChannelBookings||{},lastPublish:c.lastPublish||'',sheet:c.sheet||{},market:c.market||{rows:[],requests:[],lastFetch:''}};
  }
  function saveCalSync(){ return save('calSync',calSync); }
  function randomKey(){ var a='abcdefghjkmnpqrstuvwxyz23456789',k=''; for(var i=0;i<20;i++) k+=a[Math.floor(Math.random()*a.length)]; return k; }

  function icsDate(v){ var m=String(v).match(/(\d{4})(\d{2})(\d{2})/); return m?m[1]+'-'+m[2]+'-'+m[3]:''; }
  function icsText(v){ return String(v).replace(/\\n/gi,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\'); }
  function parseICS(text){
    var lines=String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n[ \t]/g,'').split('\n');
    var evs=[], cur=null;
    lines.forEach(function(l){
      if(l==='BEGIN:VEVENT'){ cur={}; return; }
      if(l==='END:VEVENT'){
        if(cur&&cur.start){ if(!cur.end||cur.end<=cur.start) cur.end=addDays(cur.start,1); evs.push(cur); }
        cur=null; return;
      }
      if(!cur) return;
      var i=l.indexOf(':'); if(i<0) return;
      var name=l.slice(0,i).split(';')[0].toUpperCase(), val=l.slice(i+1);
      if(name==='DTSTART') cur.start=icsDate(val);
      else if(name==='DTEND') cur.end=icsDate(val);
      else if(name==='SUMMARY') cur.summary=icsText(val).trim();
      else if(name==='UID') cur.uid=val.trim();
      else if(name==='DESCRIPTION') cur.description=icsText(val);
    });
    return evs;
  }
  function classifyEvent(feed,ev){
    var s=(ev.summary||'').toLowerCase(), d=ev.description||'';
    var code=(d.match(/reservations\/details\/([A-Z0-9]+)/i)||[])[1]||'';
    var phone4=(d.match(/Last 4 Digits\)?:\s*(\d{4})/i)||[])[1]||'';
    var kind=(code || /reserved|reservation|booked/.test(s)) ? 'reserved' : 'unavailable';
    return {uid:ev.uid||(feed+ev.start+ev.end),feed:feed,start:ev.start,end:ev.end,summary:ev.summary||'',kind:kind,code:code,phone4:phone4};

  // Parses one row of the BookingsArchive tab. The tab mixes several column orders from older
  // versions of the booking site, so this reads by pattern instead of by header.
  var ARCH_STATUS=/^(confirmed|pending|cancell?ed|declined|rejected|completed|paid|checked[ -]?in|done)$/i;
  var ARCH_SOURCE=/^(airbnb|booking\.?com|bookingcom|booking com|agoda|facebook|fb|direct|walk-?in|instagram|tiktok|referral)$/i;
  function parseArchiveRow(cells){
    cells=(cells||[]).map(function(v){return v===null||v===undefined?'':v;});
    var isDate=function(v){ return typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && v>='2020-01-01'; };
    var isNum=function(v){ return typeof v==='number' || (typeof v==='string' && /^-?[\d,]+(\.\d+)?$/.test(v.trim()) && v.trim()!==''); };
    var num=function(v){ return typeof v==='number'?v:Number(String(v).replace(/,/g,''))||0; };
    var out={id:'',type:'booking',status:'',source:'',name:'',checkIn:'',checkOut:'',total:0,amountPaid:'',amountDue:'',paymentOption:'',guests:''};
    // id + type + status + source
    cells.forEach(function(v,i){
      var s=typeof v==='string'?v.trim():'';
      if(!out.id && /^[A-Z]{2,8}-[A-Z0-9]{4,}$/.test(s)) out.id=s;
      if(!out.id && /^ref:/.test(s)) out.id=s.slice(4);
      if(i<6 && /^(booking|block)$/i.test(s)) out.type=s.toLowerCase();
      if(i<8 && !out.status && ARCH_STATUS.test(s)) out.status=s.toLowerCase();
      if(i<8 && !out.source && ARCH_SOURCE.test(s)) out.source=s;
    });
    if(!out.type || cells.slice(0,40).some(function(v){return v==='block';})) out.type=cells.slice(0,6).some(function(v){return v==='block';})?'block':'booking';
    // name: first plain text in the first 8 columns that isn't an id, type, status, source, number, date or flag
    for(var i=1;i<8 && !out.name;i++){
      var v=cells[i];
      if(typeof v!=='string') continue;
      var s=v.trim();
      if(!s || /^ref:/.test(s) || /^(booking|block)$/i.test(s) || ARCH_STATUS.test(s) || ARCH_SOURCE.test(s) || isNum(s) || isDate(s) || /^(true|false)$/i.test(s) || /^[A-Z]{2,8}-[A-Z0-9]{4,}$/.test(s)) continue;
      if(/^(sms|viber|whatsapp|call|messenger|email)$/i.test(s)) continue;
      out.name=s;
    }
    // dates: first check-in/check-out pair (check-out after check-in, at most 60 nights)
    var di=-1;
    for(var j=0;j<cells.length-1;j++){
      if(isDate(cells[j]) && isDate(cells[j+1]) && cells[j+1]>cells[j]){
        var n=Math.round((new Date(cells[j+1]+'T00:00:00')-new Date(cells[j]+'T00:00:00'))/86400000);
        if(n>0 && n<=60){ out.checkIn=cells[j]; out.checkOut=cells[j+1]; di=j+1; break; }
      }
    }
    if(di<0) return out;
    // guests: the small number just before the dates (within 6 cells), when present
    for(var g=di-2;g>=Math.max(0,di-8);g--){ if(isNum(cells[g]) && num(cells[g])>=1 && num(cells[g])<=20){ out.guests=String(num(cells[g])); break; } }
    // total: first amount of at least 500 after check-out, before the payment option
    var pi=-1;
    for(var k=di+1;k<cells.length;k++){
      var s2=typeof cells[k]==='string'?cells[k].trim().toLowerCase():'';
      if(s2==='deposit'||s2==='full'){ pi=k; out.paymentOption=s2; break; }
      if(!out.total && isNum(cells[k]) && num(cells[k])>=500) out.total=num(cells[k]);
    }
    if(pi>-1){
      var nums=[];
      for(var m=pi+1;m<cells.length && nums.length<2;m++){
        var c=cells[m];
        if(isNum(c)) nums.push(num(c));
        else if(c===''||isDate(c)) { if(isDate(c)) break; continue; }
        else if(typeof c==='boolean') break;
      }
      if(nums.length) out.amountPaid=nums[0];
      if(nums.length>1) out.amountDue=nums[1];
    }
    return out;
  }

      var cancelled=/cancel|declin|reject|void|refund/.test(st);
      var active=!cancelled && (st===''||/confirm|paid|check|complete|done/.test(st));
      if(type==='block'){
        var blk=(calSync.blocks||[]).find(function(b){return b.sheetRef===ref;});
        if(cancelled){ if(blk) items.push({kind:'unblock',ref:ref,r:r,blk:blk}); return; }
        if(co<=today()) return;
        if(!blk) items.push({kind:'block',ref:ref,r:r,start:ci,end:co});
        else if(blk.start!==ci||blk.end!==co) items.push({kind:'reblock',ref:ref,r:r,blk:blk,start:ci,end:co});
        return;
      }
      var bk=bookings.find(function(b){return b.sheetRef===ref;});
      var data={guest:(r.name||'Guest').trim(),phone:r.phone||'',channel:sheetChannel(r),checkIn:ci,checkOut:co,amount:sheetMoney(r.total),
        pax:r.guests||'',pets:r.pets||'',notes:r.notes||'',amountPaid:sheetMoney(r.amountPaid),amountDue:sheetMoney(r.amountDue),balanceDueDate:normSheetDate(r.balanceDueDate)};
      if(r.archived && co<=today()){ data.amountPaid=data.amount; data.amountDue=0; } // past stay: balance was collected at check-in
      if(!active){ if(bk && cancelled) items.push({kind:'remove',ref:ref,r:r,bk:bk}); return; }
      if(!bk){
        if(!r.archived && co<addDays(today(),-60)) return;
        var match=bookings.find(function(b){return b.propertyId===pid && !b.sheetRef && b.checkIn===ci && b.checkOut===co;});
        items.push(match?{kind:'link',ref:ref,r:r,bk:match,data:data}:{kind:'add',ref:ref,r:r,data:data});
        return;
      }
      var ch=[];
      if(bk.checkIn!==ci||bk.checkOut!==co) ch.push('dates '+bk.checkIn+'→'+bk.checkOut+' to '+ci+'→'+co);
      if(bk.source==='sheet' && (bk.guest||'')!==data.guest) ch.push('name');
      if(bk.source==='sheet' && Number(bk.amount||0)!==data.amount) ch.push('total '+fmt(bk.amount)+' → '+fmt(data.amount));
      if(Number(bk.amountPaid||0)!==data.amountPaid||Number(bk.amountDue||0)!==data.amountDue) ch.push('payment (paid '+fmt(data.amountPaid)+', due '+fmt(data.amountDue)+')');
      if((bk.pax||'')!==data.pax||(bk.pets||'')!==data.pets||(bk.notes||'')!==data.notes) ch.push('pax/pets/notes');
      if(ch.length) items.push({kind:'update',ref:ref,r:r,bk:bk,data:data,changes:ch});
    });
    return items;
  }
  function applySheetItem(it){
    var cfg=sheetCfg(), pid=cfg.propertyId;

    }else if(it.kind==='link'){
      var b=it.bk, d2=it.data; b.sheetRef=it.ref;
      if(b.source==='ical'||!Number(b.amount)){ b.guest=d2.guest; b.amount=d2.amount; b.channel=d2.channel; b.source='sheet'; }
      b.phone=b.phone||d2.phone; b.pax=d2.pax; b.pets=d2.pets; b.notes=d2.notes; b.amountPaid=d2.amountPaid; b.amountDue=d2.amountDue; b.balanceDueDate=d2.balanceDueDate;
    }else if(it.kind==='update'){
      var u=it.bk, d3=it.data;
      u.checkIn=d3.checkIn; u.checkOut=d3.checkOut;
      if(u.source==='sheet'){ u.guest=d3.guest; u.amount=d3.amount; }

      calSync.blocks.push({id:uid(),propertyId:pid,start:it.start,end:it.end,reason:'Website block'+(it.r.name?' — '+it.r.name:''),sheetRef:it.ref});

  function syncSheet(silent){

      var d; try{ d=JSON.parse(txt); }catch(e){ throw new Error('Your Google script did not answer properly.'); }

  // ---- Blocks: dates you close from the dashboard ----
  function blocksFor(pid){ return (calSync.blocks||[]).filter(function(b){return b.propertyId===pid && b.end>today();}); }
  function blockOn(pid,d){ return (calSync.blocks||[]).find(function(b){return b.propertyId===pid && b.start<=d && d<b.end;}); }
  function feedUrl(pid){ return calSync.proxyUrl?calSync.proxyUrl+'?feed='+encodeURIComponent(pid)+'&t='+calSync.feedToken:''; }
  function feedRangesFor(pid){
    var t=today(), out=[], inc=!!(calSync.includeChannelBookings||{})[pid];
    var ymd=function(d){return d.replace(/-/g,'');};
    blocksFor(pid).forEach(function(b){ out.push([ymd(b.start),ymd(b.end),'Blocked']); });
    bookings.forEach(function(b){
      if(b.propertyId!==pid || !b.checkIn || !b.checkOut || b.checkOut<=t || b.source==='ical') return;
      var ch=b.channel||'';
      if(!inc && (ch==='Airbnb'||ch==='Booking.com')) return;
      out.push([ymd(b.checkIn),ymd(b.checkOut),'Reserved']);
    });
    return out;
  }
  var feedPublishMsg='';

    if(!calSync.proxyUrl) return Promise.resolve();
    var feeds={};
    props.forEach(function(p){ feeds[p.id]=feedRangesFor(p.id); });
    var body=JSON.stringify({key:calSync.proxyKey,token:calSync.feedToken,feeds:feeds});
    return fetch(calSync.proxyUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,redirect:'follow'})
      .then(function(r){return r.text();}).then(function(txt){
        var d; try{ d=JSON.parse(txt); }catch(e){ throw new Error('no-json'); }
        if(!d.ok) throw new Error(d.error||'Unknown error');
        if(!d.version || d.version<SCRIPT_VERSION) throw new Error('old-script');
        calSync.lastPublish=new Date().toISOString(); feedPublishMsg='';
        return saveCalSync();

  // Night index: which booking occupies each night, per property (built once per render)

  function bookedOn(pid,d){ var m=nightIndex()[pid]; return m?m[d]:null; }

  function histStats(pid,days){
    var t=today(), from=addDays(t,-days), nights=0, rev=0, stays=0, ch={};
    bookings.forEach(function(b){

  function compAvg(pid,forDate){
    var since=addDays(today(),-30);
    var list=pricing.comps.filter(function(c){
      if(c.propertyId!==pid||!Number(c.price)) return false;
      if(forDate) return c.forDate===forDate;
      return (c.checkedOn||'')>=since;

  function resolveBase(pid){
    var s=pSettings(pid);

    // length of the open stretch containing night d, and whether it is boxed in by bookings on both sides
    var back=0, fwd=0;
    while(back<10 && !bookedOn(pid,addDays(d,-(back+1)))) back++;

  function suggestPrice(pid,d){

    var pct=0, reasons=['Base '+fmt(b.value)+' ('+b.source+')'];
    function add(p,label){ if(!p) return; pct+=p; reasons.push((p>0?'+':'')+p+'% '+label); }
    var dow=new Date(d+'T00:00:00').getDay();
    if(dow===5||dow===6) add(s.weekendPct,'weekend');
    var evs=eventsOn(d);
    if(evs.length){
      var top=evs.slice().sort(function(a,c){return Math.abs(Number(c.pct))-Math.abs(Number(a.pct));})[0];
      add(Number(top.pct)||0,top.name);
    }
    var lead=daysBetween(today(),d);
    if(lead<=s.lastMinuteDays) add(-s.lastMinutePct,'last-minute');
    else if(lead>=s.farOutDays) add(s.farOutPct,'far out (room to drop later)');
    if(lead>s.lastMinuteDays && lead<=s.paceWindow){
      var occ=occAround(pid,d);

    }

    if(g.boxed && g.len<=2) add(-s.orphanPct,g.len+'-night gap');
    var price=b.value*(1+pct/100);
    if(s.min && price<s.min){ price=s.min; reasons.push('held at your minimum'); }
    if(s.max && price>s.max){ price=s.max; reasons.push('capped at your maximum'); }

  function compFromLink(link){
    var out={channel:'',name:''};

    if(/airbnb\./i.test(link)){ out.channel='Airbnb'; m=link.match(/rooms\/(\d+)/); if(m) out.name='Airbnb listing …'+m[1].slice(-5); m=link.match(/airbnb\.[a-z.]+\/h\/([^/?#]+)/i); if(m) out.name=m[1].replace(/[-_]+/g,' '); }

  function compKey(c){ return (c.link||'').split('?')[0].toLowerCase() || ('name:'+(c.name||'').toLowerCase()); }

  // ---- Market check by Claude: results Claude saves to your Drive folder each week / on request ----
  var marketMsg='', marketBusy=false;
  function marketCfg(){ calSync.market=calSync.market||{rows:[],requests:[],lastFetch:''}; return calSync.market; }
  function marketRowsFor(pid){
    var m=marketCfg(); if(!m.rows.length) return [];
    // newest results file per unit only
    var mine=m.rows.filter(function(r){ return findPropertyId(r.unit)===pid; });
    if(!mine.length) return [];
    var latest=mine.reduce(function(a,r){ return (r.checkedOn||'')>a?(r.checkedOn||''):a; },'');
    return mine.filter(function(r){return r.checkedOn===latest;});
  }
  function marketStats(pid){
    var rows=marketRowsFor(pid), prices=rows.map(function(r){return Number(r.price)||0;}).filter(Boolean).sort(function(a,b){return a-b;});
    if(!prices.length) return {count:0,rows:rows};
    var mid=prices.length%2?prices[(prices.length-1)/2]:(prices[prices.length/2-1]+prices[prices.length/2])/2;
    return {count:prices.length,min:prices[0],max:prices[prices.length-1],mid:mid,avg:prices.reduce(function(s,v){return s+v;},0)/prices.length,rows:rows,checkedOn:rows[0]&&rows[0].checkedOn};
  }
  function syncMarket(silent){
    if(!calSync.proxyUrl||marketBusy) return Promise.resolve();
    marketBusy=true;
    var q=calSync.proxyUrl+(calSync.proxyUrl.indexOf('?')>-1?'&':'?')+'key='+encodeURIComponent(calSync.proxyKey)+'&comps=1';
    return fetch(q,{redirect:'follow'}).then(function(r){return r.text();}).then(function(txt){
      var d; try{ d=JSON.parse(txt); }catch(e){ throw new Error('no-json'); }
      if(!d.ok){ if(!d.version||d.version<SCRIPT_VERSION||/Only Airbnb/.test(d.error||'')) throw new Error('old-script'); throw new Error(d.error||'Unknown error'); }
      var m=marketCfg(); m.rows=d.rows||[]; m.requests=d.requests||[]; m.lastFetch=new Date().toISOString(); marketMsg='';
      return saveCalSync();
    }).catch(function(err){
      marketMsg=(err.message==='old-script'||err.message==='no-json')?'Update your Google script to version '+SCRIPT_VERSION+' (Calendar sync tab) to see Claude’s market checks here.':('Couldn’t load market checks: '+err.message);
    }).then(function(){ marketBusy=false; if(!silent) render(); });
  }

    var q=calSync.proxyUrl+(calSync.proxyUrl.indexOf('?')>-1?'&':'?')+'key='+encodeURIComponent(calSync.proxyKey)+'&request=1&units='+encodeURIComponent(JSON.stringify(units))+'&note='+encodeURIComponent(note||'');
    return fetch(q,{redirect:'follow'}).then(function(r){return r.text();}).then(function(txt){
      var d=JSON.parse(txt); if(!d.ok) throw new Error(d.error||'failed');
      marketMsg='Request sent — Claude picks it up on the next run (morning or evening) and the prices appear here automatically.';
      return syncMarket(true);

  }

    tbl.appendChild(el('thead',{},[el('tr',{},[el('th',{},['Unit']),el('th',{},['Occupancy']),el('th',{},['Avg / night']),el('th',{},['Revenue']),el('th',{},['Avg stay']),el('th',{},['Channels']),el('th',{},['Open next 30']),el('th',{},['Gap nights next 30']),el('th',{},['Hint'])])]));
    var tb=el('tbody');
    var rows=props.map(function(p){
      var h=histStats(p.id,90), open=0, gaps=0;
      for(var i=0;i<30;i++){ var d=addDays(t,i); if(!bookedOn(p.id,d)){ open++; var g=gapAround(p.id,d); if(g.boxed&&g.len<=2) gaps++; } }
      return {p:p,h:h,open:open,gaps:gaps};
    }).sort(function(a,b){return a.h.occ-b.h.occ;});
    var portfolioAdr=(function(){ var n=0,r=0; rows.forEach(function(x){n+=x.h.nights;r+=x.h.rev;}); return n?r/n:0; })();
    rows.forEach(function(x){
      var s=pSettings(x.p.id), hint='';
      if(x.h.occ<s.targetOcc-20 && x.open>18) hint='Slow — try a lower base or refresh photos/title';
      else if(x.h.occ>=Math.min(95,s.targetOcc+15)) hint='Busy — room to raise prices';
      else if(x.gaps>=2) hint='Gaps — allow 1-night stays on those dates';
      var chText=Object.keys(x.h.channels).map(function(c){return c+' '+Math.round(x.h.channels[c]/x.h.stays*100)+'%';}).join(', ');
      tb.appendChild(el('tr',{},[
        el('td',{style:'white-space:nowrap'},[el('a',{href:'#',onclick:function(e){e.preventDefault();pricingProp=x.p.id;pricingView='calendar';render();}},[propShort(x.p.id)])]),
        el('td',{class:'mono',style:x.h.occ<s.targetOcc-20?'color:var(--rust)':''},[Math.round(x.h.occ)+'%']),
        el('td',{class:'mono'},[x.h.adr?fmt(x.h.adr):'—']),
        el('td',{class:'mono'},[fmt(x.h.rev)]),
        el('td',{class:'mono'},[x.h.avgStay?x.h.avgStay.toFixed(1)+' n':'—']),
        el('td',{style:'font-size:12px'},[chText||'—']),
        el('td',{class:'mono'},[String(x.open)]),
        el('td',{class:'mono',style:x.gaps?'color:var(--amber)':''},[String(x.gaps)]),
        el('td',{style:'font-size:12px;color:var(--ink-soft)'},[hint])
      ]));
    });
    tbl.appendChild(tb);
    panel.appendChild(el('div',{class:'table-scroll'},[tbl]));
    panel.appendChild(el('div',{style:'font-size:12px;color:var(--ink-soft);margin:8px 0 24px'},['Portfolio average per night (90 days): '+(portfolioAdr?fmt(portfolioAdr):'—')]));

    // weekday occupancy, portfolio-wide, last 90 days
    panel.appendChild(el('div',{class:'section-title'},['How booked each weekday is (last 90 days, all units)']));
    var names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], tot=[0,0,0,0,0,0,0], bk=[0,0,0,0,0,0,0];
    for(var i=1;i<=90;i++){
      var d=addDays(t,-i), dow=new Date(d+'T00:00:00').getDay();
      props.forEach(function(p){ tot[dow]++; if(bookedOn(p.id,d)) bk[dow]++; });
    }
    var bars=el('div',{style:'max-width:520px'});
    names.forEach(function(n,k){
      var pct=tot[k]?bk[k]/tot[k]*100:0;
      bars.appendChild(el('div',{style:'display:flex;align-items:center;gap:10px;margin-bottom:6px'},[
        el('div',{style:'width:36px;font-size:12px;color:var(--ink-soft)'},[n]),
        el('div',{style:'flex:1;background:var(--line-soft);border-radius:4px;height:14px;overflow:hidden'},[el('div',{style:'height:100%;width:'+pct.toFixed(1)+'%;background:var(--accent);border-radius:4px'})]),
        el('div',{class:'mono',style:'width:40px;text-align:right;font-size:12px'},[Math.round(pct)+'%'])
      ]));
    });
    panel.appendChild(bars);
    panel.appendChild(pNote('If weekdays are much emptier than weekends, lower weekday base slightly and raise Weekend +% instead of discounting every night.'));
  }
  // ================= end PRICING =================

  function render(){
    _nightIdx=null;
    var _dr=document.getElementById('night-drawer'); if(_dr && !(activeTab==='pricing' && pricingView==='multi' && mcSel)) _dr.remove();
    var root=document.getElementById('app');
    root.innerHTML='';
    if(!loaded){root.appendChild(el('div',{class:'empty'},['Loading\u2026']));return;}
    renderTopbar(root);
    renderTabs(root);
    var panel=el('div',{class:'panel'});
    if(activeTab==='overview')renderOverview(panel);
    else if(activeTab==='properties')renderProperties(panel);
    else if(activeTab==='bookings')renderBookings(panel);
    else if(activeTab==='pricing')renderPricing(panel);
    else if(activeTab==='calsync')renderCalSync(panel);
    else if(activeTab==='expenses')renderExpenses(panel);
    else if(activeTab==='owner')renderOwnerReport(panel);
    else if(activeTab==='earnings')renderMyEarnings(panel);
    else if(activeTab==='cleaning')renderCleaningSchedule(panel);
    else if(activeTab==='maintenance')renderMaintenance(panel);
    else if(activeTab==='backup')renderBackup(panel);
    root.appendChild(panel);
  }

  document.addEventListener('focusin', function(ev){
    var t = ev.target;
    if (t && (t.tagName==='INPUT' || t.tagName==='SELECT' || t.tagName==='TEXTAREA')) {
      setTimeout(function(){
        t.scrollIntoView({block:'center', behavior:'smooth'});
      }, 300);
    }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW registration failed',e); });
    });
  }

  bootstrap();
})();
</script>
